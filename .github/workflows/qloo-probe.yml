name: Qloo probe

on:
  # Only the dedicated sentinel path can trigger a push run.
  # Ordinary code/docs pushes cannot spend Qloo quota.
  push:
    branches:
      - main
    paths:
      - ".qloo-insights-once"
  workflow_dispatch:
    inputs:
      mode:
        description: "One-request cross-domain Insights probe"
        required: true
        type: choice
        options:
          - insights
        default: insights
      max_requests:
        description: "Hard request ceiling for this run"
        required: true
        type: choice
        options:
          - "1"
        default: "1"

permissions:
  contents: read

concurrency:
  group: qloo-probe
  cancel-in-progress: false

jobs:
  insights:
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'insights' && inputs.max_requests == '1') }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      QLOO_API_KEY: ${{ secrets.QLOO_API_KEY }}
      MAX_REQUESTS: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check secret is configured without revealing it
        shell: bash
        run: |
          if [ -z "${QLOO_API_KEY}" ]; then
            echo "::error::Missing repository secret QLOO_API_KEY. No API request was made."
            exit 1
          fi
          echo "API secret is configured. Value will not be printed."
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Run exactly one cross-domain Insights request
        run: python scripts/probe.py
      - name: Upload sanitized result
        if: always() && hashFiles('results.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: qloo-insights-results
          path: results.json
          if-no-files-found: error
          retention-days: 3
