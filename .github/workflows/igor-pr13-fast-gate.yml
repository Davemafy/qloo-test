name: Igor first-turn reliability gate — private checkout
on:
  push:
    branches: [main]
    paths: [".github/workflows/igor-pr13-fast-gate.yml"]
permissions:
  contents: read
jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      OPENAI_API_KEY: ""
      QLOO_API_KEY: ""
      GEMINI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Davemafy/igor
          ref: b46ef45746710e872dd22451459e5eceb22c92ea
          token: ${{ secrets.PRIVATE_CI_READ_TOKEN }}
          persist-credentials: false
          path: private-source
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: private-source/package-lock.json
      - name: TypeScript error codes only (never emit private source)
        working-directory: private-source
        shell: bash
        run: |
          npm run typecheck > "$RUNNER_TEMP/private-tsc.log" 2>&1 || true
          grep -oE 'error TS[0-9]+' "$RUNNER_TEMP/private-tsc.log" | sort | uniq -c || true
          rm -f "$RUNNER_TEMP/private-tsc.log"
      - name: Verify targeted behavior and production compile
        shell: bash
        working-directory: private-source
        run: |
          set -uo pipefail
          log="$RUNNER_TEMP/private-gate.log"
          trap 'rm -f "$log"' EXIT
          failed=0
          quiet() {
            name="$1"; shift
            if "$@" >"$log" 2>&1; then
              echo "$name: PASS"
              echo "- $name: PASS" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::error::$name: FAIL (private diagnostics withheld)"
              echo "- $name: FAIL" >> "$GITHUB_STEP_SUMMARY"
              failed=$((failed+1))
            fi
            : > "$log"
          }
          quiet "Dependency install" npm ci
          quiet "Next route/type generation" npx next typegen
          quiet "TypeScript compiler only" npx tsc --noEmit
          quiet "TypeScript" npm run typecheck
          quiet "New fast-model tests only" npx vitest run --config tests/vitest.config.mts tests/unit/responsive-gemini.test.ts
          quiet "Existing Liquid UI tests only" npx vitest run --config tests/vitest.config.mts tests/unit/liquid-discovery.test.ts
          quiet "Existing native-workspace tests only" npx vitest run --config tests/vitest.config.mts tests/unit/native-workspace.test.ts
          quiet "Existing conversation tests only" npx vitest run --config tests/vitest.config.mts tests/unit/conversation.test.ts
          quiet "Recording regressions only" npx vitest run --config tests/vitest.config.mts tests/unit/recording-regressions.test.ts
          quiet "Build" npm run build
          exit "$failed"
