name: Igor private diagnostics — rule and test identifiers only
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/igor-private-diagnostics.yml"
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      QLOO_API_KEY: ""
      OPENAI_API_KEY: ""
      GEMINI_API_KEY: ""
    steps:
      - name: Check out pinned private revision (no shared source)
        uses: actions/checkout@v4
        with:
          repository: Davemafy/igor
          ref: 05221b9d20fb54e1e7807ad002d2e4eb9eca4d1e
          token: ${{ secrets.PRIVATE_CI_READ_TOKEN }}
          persist-credentials: false
          path: private-igor
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: private-igor/package-lock.json
      - name: Dependency installation (private diagnostics withheld)
        working-directory: private-igor
        run: npm ci --silent >/dev/null 2>&1
      - name: Report formatting and typecheck issue locations without source
        shell: bash
        working-directory: private-igor
        run: |
          set +e
          npx prettier --list-different . > "$RUNNER_TEMP/private-format.log" 2>&1
          format_exit=$?
          FORMAT_EXIT="$format_exit" python - <<'PY'
          import os,pathlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"private-format.log"
          lines=p.read_text(errors="replace").splitlines()
          names=[pathlib.Path(x).name for x in lines if x.strip() and not x.startswith("[")]
          print("FORMAT_EXIT:",os.environ["FORMAT_EXIT"],"FORMAT_FILES:",len(names))
          for name in names[:40]: print("FORMAT:",name)
          PY
          npm run typecheck > "$RUNNER_TEMP/private-type.log" 2>&1
          type_exit=$?
          TYPE_EXIT="$type_exit" python - <<'PY'
          import os,re,pathlib,collections
          text=(pathlib.Path(os.environ["RUNNER_TEMP"])/"private-type.log").read_text(errors="replace")
          matches=[]
          for line in text.splitlines():
            m=re.match(r'(.+?)\((\d+),(\d+)\): error TS(\d+):',line)
            if m: matches.append((pathlib.Path(m.group(1)).name,m.group(2),m.group(4)))
          print("TYPECHECK_EXIT:",os.environ["TYPE_EXIT"],"TYPE_ERRORS:",len(matches))
          print("TYPE_ERROR_CODES:",dict(collections.Counter(m[2] for m in matches)))
          for file,line,code in matches[:35]: print("TYPE_ERROR:",file,line,"TS"+code)
          PY
          rm -f "$RUNNER_TEMP/private-format.log" "$RUNNER_TEMP/private-type.log"
          exit 0
      - name: Summarize lint rule identifiers only
        shell: bash
        working-directory: private-igor
        run: |
          set +e
          npx eslint src tests scripts next.config.ts eslint.config.mjs --format json > "$RUNNER_TEMP/eslint.json" 2>"$RUNNER_TEMP/eslint-errors"
          python - <<'PY'
          import os,json,collections,pathlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"eslint.json"
          try: data=json.loads(p.read_text())
          except Exception: print("LINT: JSON report unavailable"); quit()
          findings=[]
          for f in data:
            for m in f.get('messages',[]):
              if m.get("severity")==2:
                findings.append((pathlib.Path(f['filePath']).name,m.get('line'),m.get('column'),m.get('ruleId') or 'parser/error'))
          print("LINT ERROR COUNT:",len(findings))
          print("RULE COUNTS:",dict(collections.Counter(x[3] for x in findings)))
          for name,line,col,rule in findings[:35]:
            print("LINT:",name,line,col,rule)
          PY
          rm -f "$RUNNER_TEMP/eslint.json" "$RUNNER_TEMP/eslint-errors"
          exit 0
      - name: List failing unit-test names only
        shell: bash
        working-directory: private-igor
        run: |
          set +e
          npm test -- --reporter=json --outputFile="$RUNNER_TEMP/vitest.json" >"$RUNNER_TEMP/vitest-console" 2>&1
          python - <<'PY'
          import os,json,pathlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"vitest.json"
          try: data=json.loads(p.read_text())
          except Exception: print("TEST REPORT: JSON report unavailable"); quit()
          import re
          failed=[]
          for suite in data.get('testResults',[]):
            for case in suite.get('assertionResults',[]):
              if case.get('status')=='failed':
                err=(case.get("failureMessages") or [""])[0]
                err=re.sub(r"\x1b\[[0-9;]*m","",err)
                first=(err.splitlines() or [""])[0][:250]
                first=re.sub(r"['\"][^'\"]+['\"]","[redacted]",first)
                first=re.sub(r"https?://\\S+","[url]",first)
                sites=re.findall(r'([A-Za-z0-9_.-]+\\.test\\.ts):(\\d+):(\\d+)',err)
                site=(sites[-1][0]+":"+sites[-1][1]) if sites else "no-location"
                failed.append((pathlib.Path(suite.get('name','')).name,case.get('fullName','unknown')[:170],first,site))
          print("FAILED TEST COUNT:",len(failed))
          for name,case,reason,site in failed[:30]:
            print("TEST FAIL:",name," :: ",case)
            print("TEST ERROR KIND:",reason[:180])
            print("TEST ASSERTION SITE:",site)
          print("TEST TOTAL:",data.get('numTotalTests'),"PASSED:",data.get('numPassedTests'))
          PY
          rm -f "$RUNNER_TEMP/vitest.json" "$RUNNER_TEMP/vitest-console"
          exit 0
