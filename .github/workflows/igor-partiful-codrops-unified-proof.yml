name: Igor single-branch CI (private source)
# Recheck with exact-SHA health gate: 12bfb43c1ce93d0f2d2c4f2e38d1b5f5ae89e846
# Format-probe Igor SHA 3503cc1adab224b1f33f1300984efde0d31d3117
# [bounded-live] reviewed Igor engine 3503cc1adab224b1f33f1300984efde0d31d3117
# Targeted existing Gemini provider live acceptance; never fixtures
# Verify Igor engine SHA 3503cc1adab224b1f33f1300984efde0d31d3117 (deterministic only)
# Runs ONLY in qloo-test. Igor's hosted runners are currently unhealthy.
on:
  push:
    branches: [main]
    paths: [.github/workflows/igor-partiful-codrops-unified-proof.yml]
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Optional exact Igor commit SHA; blank means current active branch HEAD
        type: string
        required: false
      run_live:
        description: Explicit opt-in to bounded paid Qloo and Gemini acceptance
        type: boolean
        default: false
  schedule:
    - cron: "17 */3 * * *"

permissions:
  contents: read

concurrency:
  # Live provider checks must not hold up source-only validation jobs.
  group: igor-${{ contains(github.event.head_commit.message, '[bounded-live]') && 'live' || contains(github.event.head_commit.message, '[format-probe]') && 'focus' || contains(github.event.head_commit.message, '[gemini-search]') && 'grounding' || contains(github.event.head_commit.message, '[xai-search]') && 'grounding' || 'verify' }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name != 'push' || (!contains(github.event.head_commit.message, '[model-readiness]') && !contains(github.event.head_commit.message, '[bounded-live]') && !contains(github.event.head_commit.message, '[format-probe]') && !contains(github.event.head_commit.message, '[gemini-search]') && !contains(github.event.head_commit.message, '[xai-search]') && !contains(github.event.head_commit.message, '[alternate-only]'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      IGOR_BRANCH: feat/partiful-codrops-unified-20261029
      QLOO_API_KEY: ""
      GEMINI_API_KEY: ""
      XAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      GROK_API_KEY: ""
      OPENAI_API_KEY: ""
      BRIGHTDATA_API_KEY: ""
      QLOO_MAX_CALLS: "0"

    steps:
      - name: Resolve exact active Igor revision using private read token
        id: revision
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.PRIVATE_CI_READ_TOKEN }}
          REQUESTED_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          if [[ -z "$READ_TOKEN" ]]; then
            echo "::error::qloo-test needs PRIVATE_CI_READ_TOKEN with contents:read on Davemafy/igor."
            exit 1
          fi
          if [[ -n "$REQUESTED_SHA" ]]; then
            if ! [[ "$REQUESTED_SHA" =~ ^[a-fA-F0-9]{40}$ ]]; then
              echo "::error::commit_sha must be a full 40-character SHA."
              exit 1
            fi
            sha="$REQUESTED_SHA"
          else
            payload="$(curl --fail --silent --show-error \
              --header "Authorization: Bearer $READ_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/Davemafy/igor/branches/$IGOR_BRANCH")"
            sha="$(node -e 'const o=JSON.parse(process.argv[1]);const s=o.commit?.sha; if(!/^[0-9a-f]{40}$/.test(s??""))process.exit(1);process.stdout.write(s)' "$payload")"
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Reviewed Igor SHA: $sha"
          {
            echo "### Igor single-branch CI"
            echo "- Source: `Davemafy/igor`"
            echo "- Branch: `$IGOR_BRANCH`"
            echo "- Exact revision: `$sha`"
            echo "- Runner: `Davemafy/qloo-test`, no Igor runner dependency"
            echo "- Providers: disabled for deterministic recorded acceptance tests"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout exact private Igor commit
        uses: actions/checkout@v4
        with:
          repository: Davemafy/igor
          ref: ${{ steps.revision.outputs.sha }}
          token: ${{ secrets.PRIVATE_CI_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: private-igor

      - name: Verify branch and upstream reuse constraints
        working-directory: private-igor
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ steps.revision.outputs.sha }}"
          test -s AGENTS.md
          test -s docs/design-system.md
          test -s src/vendor/codrops-grid/LICENSE
          test -s src/tools/trueforge.ts
          test -s tests/unit/trueforge.test.ts
          test -s docs/TRUEFORGE_INTEGRATION.md
          test -s tests/unit/durable-turn.test.ts
          test -s tests/unit/conversation-focus.test.ts
          test -s tests/unit/model-tool-protocol.test.ts
          test -s tests/unit/action-first-rich-documents.test.ts
          # Verify follow-up context, sourced media validation, and rendered drafts.
          # Recheck formatting, build and browser at current Igor SHA.
          # Final line-width normalization for source-linked media validation.
          # Verify final inline test formatting on exact branch head.
          # Object arguments, bounded model-format repair and source-preserving recovery.
          # Exact active SHA after typed diagnostics, backup support and lint/format fixes.
          # Recheck after making existing 16s fake-clock deadline test CI-load tolerant.
          # Gemini fake-timer fixture now follows native argument-object protocol.
          # Formatting fixes after 553/553 unit tests and six evaluations passed.
          grep -q 'Partiful' docs/design-system.md
          grep -q 'projectInvitationScene' src/components/agent-workspace.tsx
          grep -q 'data-size-grid' src/components/liquid-discovery.tsx

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: private-igor/package-lock.json

      - name: Install locked dependencies
        working-directory: private-igor
        run: npm ci --silent > /dev/null 2>&1

      - name: TypeScript
        working-directory: private-igor
        run: npm run typecheck

      - name: ESLint
        working-directory: private-igor
        run: npm run lint

      # The delegate is opt-in; CI exercises its official Sessions/Turns
      # protocol against deterministic mocks, never paid live providers.
      # The fixture uses actual SSE blank-line delimiters, as in TrueForge.
      # Mission: full deterministic coverage, source archive integrity, all browser projects.
      # Verify the diagnosed provider deadline fix and internal saving at the read cap.
      # Stage 1: verified retry of failed accepted turns must not reappend user messages.
      - name: All deterministic unit tests
        working-directory: private-igor
        run: npm test

      - name: Domain evaluation tests
        working-directory: private-igor
        run: npm run test:eval

      - name: Formatting audit (existing debt reported, not hidden)
        working-directory: private-igor
        shell: bash
        run: |
          set +e
          npm run format:check > "$RUNNER_TEMP/igor-format-audit.log" 2>&1
          result=$?
          echo "FORMAT_EXIT=$result"
          if [ "$result" -ne 0 ]; then
            echo "::warning::Igor repository-wide Prettier audit failed. This is outstanding quality debt."
            echo "- Formatting audit: FAIL (not yet a blocking gate)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Formatting audit: PASS" >> "$GITHUB_STEP_SUMMARY"
          fi
          rm -f "$RUNNER_TEMP/igor-format-audit.log"

      - name: Blocking formatting check for mission changes
        working-directory: private-igor
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(git diff --name-only -z --diff-filter=ACMR 64615cf48adb7092654ce5b9ad6a48e1d71ecd86 HEAD -- '*.ts' '*.tsx' '*.mjs' '*.mts' '*.json' '*.md' '*.css')
          if (( ${#files[@]} )); then npx prettier --check "${files[@]}"; fi

      - name: Production Next.js build
        working-directory: private-igor
        run: npm run build > "$RUNNER_TEMP/igor-build.log" 2>&1 || { grep -E 'error|Error|failed|Failed|Module not found' "$RUNNER_TEMP/igor-build.log" | head -25 || true; exit 1; }

      - name: Install Chromium
        working-directory: private-igor
        run: npx playwright install --with-deps chromium > /dev/null 2>&1

      - name: Source-driven Codrops gallery browser regression
        working-directory: private-igor
        run: npx playwright test --config tests/integrated.playwright.config.mts

      # This includes the full recorded collection/share/guest review journey.
      # Never silently skip it to make the Stage 1 gate green.
      # Repeat after verified accessibility fix for the reviewer Preference select.
      - name: Stage 1 persistent conversation, provider boundary and connected-work browser journeys
        working-directory: private-igor
        run: npm run test:browser -- --trace retain-on-failure

      - name: Connected work desktop and mobile acceptance
        working-directory: private-igor
        run: npm run test:connected:browser

      - name: Current main inline-work desktop and mobile regression
        working-directory: private-igor
        run: npx playwright test --config tests/inline-work.playwright.config.mts

      - name: Upload only recorded fixture screenshots (no source or traces)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: igor-single-branch-browser-evidence
          path: |
            private-igor/test-results/integrated/**/original-gallery.png
            private-igor/test-results/integrated/**/original-detailed.png
            private-igor/test-results/artifacts/**/igor-native-invitation-*.png
            private-igor/test-results/results.json
            private-igor/test-results/connected-work/**/*.webm
            private-igor/test-results/morphing/*.png
            private-igor/test-results/inline-work-*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Record exact verified SHA
        if: success()
        run: echo "PASS — Igor commit ${{ steps.revision.outputs.sha }} at $(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_STEP_SUMMARY"

  live-acceptance:
    # Never spend on the existing scheduled deterministic CI or ordinary pushes.
    if: (github.event_name == 'workflow_dispatch' && inputs.run_live) || (github.event_name == 'push' && (contains(github.event.head_commit.message, '[alternate-only]') || contains(github.event.head_commit.message, '[bounded-live]')))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Pin the exact reviewed Igor engine revision
        id: revision
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.PRIVATE_CI_READ_TOKEN }}
          REQUESTED_SHA: ${{ inputs.commit_sha }}
          IGOR_BRANCH: feat/partiful-codrops-unified-20261029
        run: |
          set -euo pipefail
          test -n "$READ_TOKEN" || { echo "::error::Private read token unavailable."; exit 1; }
          if [[ -n "$REQUESTED_SHA" ]]; then
            sha="$REQUESTED_SHA"
          else
            payload="$(curl --fail --silent --show-error \
              --header "Authorization: Bearer $READ_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/Davemafy/igor/branches/$IGOR_BRANCH")"
            sha="$(node -e 'const o=JSON.parse(process.argv[1]); process.stdout.write(o.commit?.sha ?? "")' "$payload")"
          fi
          [[ "$sha" =~ ^[a-fA-F0-9]{40}$ ]] || { echo "::error::Invalid Igor commit SHA."; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Live acceptance source SHA: $sha"
      - name: Select an existing authorized provider without printing values
        id: providers
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          QLOO_API_KEY: ${{ secrets.QLOO_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ALTERNATE_ONLY: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[alternate-only]') }}
        run: |
          set -euo pipefail
          test -n "$QLOO_API_KEY" || { echo "::error::BLOCKED: no existing Qloo binding."; exit 1; }
          if [[ "$ALTERNATE_ONLY" != "true" && -n "$GEMINI_API_KEY" ]]; then
            provider=gemini
          elif [[ -n "$ANTHROPIC_API_KEY" ]]; then
            provider=claude
          elif [[ -n "$XAI_API_KEY" || -n "$GROK_API_KEY" ]]; then
            provider=grok
          else
            echo "::error::BLOCKED: no existing Grok or Claude binding; Gemini is not retried."
            exit 1
          fi
          echo "provider=$provider" >> "$GITHUB_OUTPUT"
          echo "Selected authorized provider: $provider"
      - name: Checkout exact accepted Igor revision for bounded live run
        uses: actions/checkout@v4
        with:
          repository: Davemafy/igor
          ref: ${{ steps.revision.outputs.sha }}
          token: ${{ secrets.PRIVATE_CI_READ_TOKEN }}
          persist-credentials: false
          path: private-igor
      - name: Verify checked-out live acceptance source
        working-directory: private-igor
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ steps.revision.outputs.sha }}"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install and build exact source
        working-directory: private-igor
        run: npm ci --silent > /dev/null 2>&1 && npm run build > "$RUNNER_TEMP/live-build.log" 2>&1
      - name: Actual Gemini adapter routing check before the browser journey
        if: steps.providers.outputs.provider == 'gemini'
        working-directory: private-igor
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.1-flash-lite
        run: timeout 210 node node_modules/vitest/vitest.mjs run --config tests/live-provider.vitest.config.mts

      - name: Install Chromium for actual browser acceptance
        working-directory: private-igor
        run: npx playwright install --with-deps chromium > /dev/null 2>&1
      # Permits exactly one already configured backup through FallbackModel;
      # a provider 400/503 must not silently downgrade to fixtures.
      - name: Bounded LIVE Qloo journey with selected authorized model, never recorded fallback
        working-directory: private-igor
        env:
          IGOR_MODEL_PROVIDER: ${{ steps.providers.outputs.provider }}
          GEMINI_MODEL: gemini-3.1-flash-lite
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          QLOO_API_KEY: ${{ secrets.QLOO_API_KEY }}
          IGOR_AGENT_MAX_STEPS: "10"
          IGOR_AGENT_MAX_REQUESTS: "12"
          QLOO_MAX_CALLS: "20"
          IGOR_TEST_FIXTURES: ""
          IGOR_QLOO_RECORDING: ""
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
          BRIGHTDATA_SERP_ZONE: ${{ secrets.BRIGHTDATA_SERP_ZONE }}
          BRIGHTDATA_UNLOCKER_ZONE: ${{ secrets.BRIGHTDATA_UNLOCKER_ZONE }}
          OPENAI_API_KEY: ""
          IGOR_DB_PATH: .igor/live-acceptance/tasks.sqlite
          IGOR_AUTH_PATH: .igor/live-acceptance/auth.sqlite
          IGOR_OUTCOMES_PATH: .igor/live-acceptance/outcomes.sqlite
          IGOR_CACHE_PATH: .igor/live-acceptance/cache.sqlite
        run: |
          set -euo pipefail
          # The health endpoint must report the SAME commit checked out above.
          export IGOR_BUILD_SHA="$(git rev-parse HEAD)"
          npm start -- --port 3570 > "$RUNNER_TEMP/live-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in {1..45}; do
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "::error::Igor process exited before readiness; provider acceptance was NOT executed."
              exit 1
            fi
            if curl --fail --silent --show-error --max-time 2 \
              http://127.0.0.1:3570/api/health > "$RUNNER_TEMP/igor-health.json" 2>/dev/null; then
              if node -e 'const fs=require("fs"); const h=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if(h.status!=="ok" || h.revision!==process.env.IGOR_BUILD_SHA)process.exit(1)' "$RUNNER_TEMP/igor-health.json"; then
                ready=true
                break
              fi
            fi
            sleep 2
          done
          if [[ "$ready" != true ]]; then
            echo "::error::Igor server failed exact-SHA health readiness; skipping all paid provider calls."
            exit 1
          fi
          echo "LIVE_RUNTIME_READY_SHA=$IGOR_BUILD_SHA"
          rm -f "$RUNNER_TEMP/igor-health.json"
          status=0
          timeout 540 node scripts/verify-live-general-research.mjs || status=1
          timeout 540 node scripts/verify-live-flagship.mjs || status=1
          if [[ "$status" == "0" ]]; then
            timeout 720 node scripts/verify-live-experiences.mjs || status=1
          fi
          exit "$status"
      - name: Upload only sanitized LIVE acceptance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: igor-live-acceptance-a4d2f1c
          path: |
            private-igor/test-results/live-general-research/report.json
            private-igor/test-results/live-flagship/report.json
            private-igor/test-results/live-flagship/*.png
            private-igor/test-results/live-flagship/*.webm
            private-igor/test-results/live-experiences/report.json
            private-igor/test-results/live-experiences/*.png
            private-igor/test-results/live-experiences/*.webm
          if-no-files-found: ignore
          retention-days: 7

  provider-readiness:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[model-readiness]')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspect authorized model catalog and make one bounded stable-model protocol check
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import os,json,re,time,urllib.request,urllib.error
          key=os.environ.get("GEMINI_API_KEY","")
          if not key:
            print("BLOCKED: existing Gemini binding missing")
            raise SystemExit(1)
          def request(url,body=None):
            req=urllib.request.Request(url,data=None if body is None else json.dumps(body).encode(),headers={"x-goog-api-key":key,"Content-Type":"application/json"})
            start=time.monotonic()
            try:
              with urllib.request.urlopen(req,timeout=60) as r:
                return r.status,json.load(r),round((time.monotonic()-start)*1000)
            except urllib.error.HTTPError as e:
              return e.code,{},round((time.monotonic()-start)*1000)
          status,body,latency=request("https://generativelanguage.googleapis.com/v1beta/models?pageSize=100")
          models=sorted(m.get("name","").removeprefix("models/") for m in body.get("models",[]) if "generateContent" in m.get("supportedGenerationMethods",[]) and re.fullmatch(r"models/gemini-[a-z0-9.-]+",m.get("name","")))
          print(json.dumps({"operation":"catalog","httpStatus":status,"latencyMs":latency,"models":models}))
          selected=next((m for m in ["gemini-3.5-flash","gemini-3.1-flash-lite"] if m in models),None)
          if not selected:print("BLOCKED: no listed stable alternative selected");raise SystemExit(1)
          body={"contents":[{"role":"user","parts":[{"text":"Call provider_ready with ready true."}]}],"tools":[{"functionDeclarations":[{"name":"provider_ready","description":"A protocol availability check only.","parametersJsonSchema":{"type":"object","properties":{"ready":{"type":"boolean"}},"required":["ready"],"additionalProperties":False}}]}],"toolConfig":{"functionCallingConfig":{"mode":"ANY","allowedFunctionNames":["provider_ready"]}},"generationConfig":{"maxOutputTokens":1024,"temperature":0}}
          status,result,latency=request("https://generativelanguage.googleapis.com/v1beta/models/"+selected+":generateContent",body)
          calls=[p.get("functionCall",{}) for c in result.get("candidates",[]) for p in c.get("content",{}).get("parts",[]) if "functionCall" in p]
          valid=len(calls)==1 and calls[0].get("name")=="provider_ready" and calls[0].get("args",{}).get("ready") is True
          print(json.dumps({"operation":"protocol_check","model":selected,"httpStatus":status,"latencyMs":latency,"functionCallValid":valid,"applicationAcceptance":False}))
          if not valid:raise SystemExit(1)
          PY

  format-probe:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[format-probe]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Davemafy/igor
          ref: feat/partiful-codrops-unified-20261029
          token: ${{ secrets.PRIVATE_CI_READ_TOKEN }}
          persist-credentials: false
          path: private-igor
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: private-igor/package-lock.json
      - name: Install existing locked dependencies
        working-directory: private-igor
        run: npm ci --silent > /dev/null 2>&1
      - name: Check Igor grounded recovery and argument repair
        working-directory: private-igor
        shell: bash
        run: |
          npm run typecheck
          npm run lint
          npx vitest run --config tests/vitest.config.mts tests/unit/agent-recovery-artifact.test.ts tests/unit/agent-completion-budget.test.ts tests/unit/unified-agent.test.ts tests/unit/cultural-prerequisites.test.ts tests/unit/agent-tool-availability.test.ts tests/unit/xai-web-research.test.ts tests/unit/gemini-web-research.test.ts tests/unit/fallback-model.test.ts
          if npx prettier --check src/core/agent-recovery-artifact.ts src/core/unified-agent.ts src/core/agent-tool-registry.ts tests/unit/agent-recovery-artifact.test.ts scripts/verify-live-general-research.mjs src/core/agent-acceptance.ts tests/unit/agent-completion-budget.test.ts src/tools/xai-web-research.ts src/tools/live-research.ts tests/unit/xai-web-research.test.ts src/tools/gemini-web-research.ts tests/unit/gemini-web-research.test.ts src/tools/runtime.ts tests/unit/fallback-model.test.ts tests/unit/cultural-prerequisites.test.ts tests/unit/agent-tool-availability.test.ts; then
            exit 0
          fi
          npx prettier --write src/core/agent-recovery-artifact.ts src/core/unified-agent.ts src/core/agent-tool-registry.ts tests/unit/agent-recovery-artifact.test.ts scripts/verify-live-general-research.mjs src/core/agent-acceptance.ts tests/unit/agent-completion-budget.test.ts src/tools/xai-web-research.ts src/tools/live-research.ts tests/unit/xai-web-research.test.ts src/tools/gemini-web-research.ts tests/unit/gemini-web-research.test.ts src/tools/runtime.ts tests/unit/fallback-model.test.ts tests/unit/cultural-prerequisites.test.ts tests/unit/agent-tool-availability.test.ts > /dev/null
          git diff --unified=0 -- src/core/agent-recovery-artifact.ts src/core/unified-agent.ts src/core/agent-tool-registry.ts tests/unit/agent-recovery-artifact.test.ts scripts/verify-live-general-research.mjs src/core/agent-acceptance.ts tests/unit/agent-completion-budget.test.ts src/tools/xai-web-research.ts src/tools/live-research.ts tests/unit/xai-web-research.test.ts src/tools/gemini-web-research.ts tests/unit/gemini-web-research.test.ts src/tools/runtime.ts tests/unit/fallback-model.test.ts tests/unit/cultural-prerequisites.test.ts tests/unit/agent-tool-availability.test.ts | grep '^@@' || true
          echo "::error::Agent recovery formatting mismatch. No source published."
          exit 1

  gemini-routing:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[gemini-routing]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Davemafy/igor
          ref: feat/partiful-codrops-unified-20261029
          token: ${{ secrets.PRIVATE_CI_READ_TOKEN }}
          persist-credentials: false
          path: private-igor
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: private-igor/package-lock.json
      - name: Locked install
        working-directory: private-igor
        run: npm ci --silent > /dev/null 2>&1
      - name: Run real Gemini route regression without Qloo or fixtures
        working-directory: private-igor
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.1-flash-lite
          QLOO_API_KEY: ""
          XAI_API_KEY: ""
          ANTHROPIC_API_KEY: ""
        run: |
          test -n "$GEMINI_API_KEY" || { echo "::error::Configured Gemini binding is missing."; exit 1; }
          echo "Reviewed engine SHA: $(git rev-parse HEAD)"
          timeout 210 node node_modules/vitest/vitest.mjs run --config tests/live-provider.vitest.config.mts

  xai-web-search-pilot:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[xai-search]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Inspect configured model catalog and run a bounded cited web search
        shell: bash
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,urllib.error
          key=os.getenv("XAI_API_KEY") or os.getenv("GROK_API_KEY")
          if not key:
              print("XAI_SEARCH_BLOCKED: no configured key")
              raise SystemExit(1)
          headers={"Authorization":"Bearer "+key,"Content-Type":"application/json"}
          candidates=("grok-4.7","grok-4.6","grok-4.3","grok-4")
          try:
              req=urllib.request.Request("https://api.x.ai/v1/models",headers=headers)
              with urllib.request.urlopen(req,timeout=25) as response:
                  catalog=json.load(response)
              available={m.get("id") for m in catalog.get("data",[]) if isinstance(m,dict)}
              print("XAI_MODEL_CATALOG",json.dumps({"reachable":True,"usableCandidates":[m for m in candidates if m in available],"totalModelCount":len(available)}))
          except (urllib.error.HTTPError,urllib.error.URLError,ValueError):
              print("XAI_MODEL_CATALOG",json.dumps({"reachable":False}))
              available=set()
          def error_kind(err):
              try:
                  data=json.load(err)
                  detail=data.get("error",data)
                  message=str(detail.get("message","")) if isinstance(detail,dict) else ""
                  code=str(detail.get("code","")) if isinstance(detail,dict) else ""
                  value=(message+" "+code).lower()
              except (ValueError,AttributeError,TypeError):
                  return "unknown"
              for kind,words in (
                  ("access",("permission","not allowed","not authorized","not available","not accessible")),
                  ("model",("model","not found","unknown")),
                  ("billing",("credit","insufficient","billing","balance")),
                  ("schema",("max_turns","invalid","unsupported","tool","parameter","field","input")),
                  ("authentication",("api key","unauthorized","authentication")),
              ):
                  if any(word in value for word in words):
                      return kind
              return "unknown"
          models=[m for m in candidates if m in available] or ["grok-4.7","grok-4.3"]
          for model in models[:2]:
              data={
                  "model":model,
                  "max_turns":2,
                  "input":[{"role":"user","content":"Search the web for an official energy-agency report about EV charging. Return one cited public source."}],
                  "tools":[{"type":"web_search"}],
              }
              req=urllib.request.Request("https://api.x.ai/v1/responses",data=json.dumps(data).encode(),headers=headers,method="POST")
              try:
                  with urllib.request.urlopen(req,timeout=95) as response:
                      body=json.load(response)
                      citations=body.get("citations") or []
                      usage=(body.get("usage") or {}).get("server_side_tool_usage_details") or {}
                      print("XAI_SEARCH_PILOT",json.dumps({"model":model,"httpStatus":response.status,"status":body.get("status"),"citationCount":len(citations),"webSearchCalls":usage.get("web_search_calls")}))
                      if body.get("status")=="completed" and citations:
                          raise SystemExit(0)
              except urllib.error.HTTPError as err:
                  print("XAI_SEARCH_PILOT",json.dumps({"model":model,"httpStatus":err.code,"category":error_kind(err),"citationCount":0}))
                  if err.code not in (400,404,422):
                      raise SystemExit(1)
          raise SystemExit(1)
          PY

  gemini-search-pilot:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[gemini-search]')
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
    steps:
      - name: Verify real structured Google Search grounding through existing Gemini key
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,urllib.error
          key=os.getenv("GEMINI_API_KEY")
          if not key:
              print("GEMINI_GROUNDING_BLOCKED: key not configured")
              raise SystemExit(1)
          for model in ("gemini-3.5-flash-lite","gemini-2.5-flash"):
              body={
                  "contents":[{"role":"user","parts":[{"text":"Find a current public energy-agency report about electric-vehicle charging infrastructure. Use Google Search and cite the source."}]}],
                  "tools":[{"google_search":{}}],
                  "generationConfig":{"maxOutputTokens":800},
              }
              req=urllib.request.Request(
                  "https://generativelanguage.googleapis.com/v1beta/models/"+model+":generateContent",
                  data=json.dumps(body).encode(),method="POST",
                  headers={"Content-Type":"application/json","x-goog-api-key":key},
              )
              try:
                  with urllib.request.urlopen(req,timeout=95) as response:
                      content=json.load(response)
                      chunks=((content.get("candidates") or [{}])[0].get("groundingMetadata") or {}).get("groundingChunks") or []
                      urls=[x["web"]["uri"] for x in chunks if isinstance(x,dict) and isinstance(x.get("web"),dict) and isinstance(x["web"].get("uri"),str)]
                      print("GEMINI_GROUNDING_PILOT",json.dumps({"model":model,"httpStatus":response.status,"groundedSourceCount":len(urls),"safetyRefusal":not bool(content.get("candidates"))}))
                      if urls:
                          raise SystemExit(0)
              except urllib.error.HTTPError as error:
                  print("GEMINI_GROUNDING_PILOT",json.dumps({"model":model,"httpStatus":error.code,"groundedSourceCount":0}))
                  if error.code not in (400,404,422,429,503):
                      raise SystemExit(1)
          raise SystemExit(1)
          PY
