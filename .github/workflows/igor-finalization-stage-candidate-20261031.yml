name: Igor finalization-stage candidate verification
on:
  push:
    branches: [main]
    paths: [.github/workflows/igor-finalization-stage-candidate-20261031.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      QLOO_API_KEY: ""
      OPENAI_API_KEY: ""
      GEMINI_API_KEY: ""
      XAI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Davemafy/igor
          ref: acbf63cf218768c8b54778b5dc59cdf74c761d44
          token: ${{ secrets.PRIVATE_CI_READ_TOKEN }}
          persist-credentials: false
          path: igor
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: igor/package-lock.json
      - run: npm ci
        working-directory: igor
      - name: Normalize formatting and show exact patch
        working-directory: igor
        run: |
          npx prettier --write src/core/unified-agent.ts src/core/agent-tool-registry.ts tests/unit/agent-intent-boundary.test.ts tests/unit/agent-research-first.test.ts
          echo BEGIN_IGOR_FORMAT_DIFF
          git diff --no-color -- src/core/unified-agent.ts src/core/agent-tool-registry.ts tests/unit/agent-intent-boundary.test.ts tests/unit/agent-research-first.test.ts
          echo END_IGOR_FORMAT_DIFF
      - run: npm run typecheck
        working-directory: igor
      - name: Apply repository lint auto-fixes
        working-directory: igor
        run: npx eslint --fix src/core/unified-agent.ts src/core/agent-tool-registry.ts tests/unit/agent-intent-boundary.test.ts tests/unit/agent-research-first.test.ts
      - run: npx eslint src/core/unified-agent.ts src/core/agent-tool-registry.ts tests/unit/agent-intent-boundary.test.ts tests/unit/agent-research-first.test.ts
        working-directory: igor
      - name: Full unit regression suite
        run: npm test
        working-directory: igor
      - run: npm run build
        working-directory: igor
      - name: Emit exact verified source normalization diff
        if: always()
        working-directory: igor
        run: |
          echo BEGIN_VERIFIED_MARKET_DIFF
          git diff --no-color -- src/core/unified-agent.ts src/core/agent-tool-registry.ts tests/unit/agent-intent-boundary.test.ts tests/unit/agent-research-first.test.ts
          echo END_VERIFIED_MARKET_DIFF
