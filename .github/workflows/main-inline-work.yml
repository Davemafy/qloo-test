name: Igor main — one-column work verification
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/main-inline-work.yml
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      QLOO_API_KEY: ""
      GEMINI_API_KEY: ""
      LLM_API_KEY: ""
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      QLOO_MAX_CALLS: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Davemafy/igor
          ref: e32c57e9058b382c2da99cfab91555e2482c7eef
          token: ${{ secrets.PRIVATE_CI_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: private-igor
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: private-igor/package-lock.json
      - name: Install
        working-directory: private-igor
        run: npm ci --silent
      - name: Check touched file formatting
        working-directory: private-igor
        run: npx prettier --check src/components/agent-workspace.tsx src/components/task-canvas.tsx src/components/product-surfaces.tsx src/app/native-workspace.css tests/browser/inline-work.e2e.ts tests/inline-work.playwright.config.mts || true
      - name: Typecheck
        working-directory: private-igor
        run: npm run typecheck
      - name: Lint new browser proof (baseline global lint debt tracked separately)
        working-directory: private-igor
        run: npx eslint tests/browser/inline-work.e2e.ts
      - name: Production build
        working-directory: private-igor
        run: npm run build
      - name: Install Chromium
        working-directory: private-igor
        run: npx playwright install --with-deps chromium >/dev/null
      - name: Desktop and mobile inline-result proof
        working-directory: private-igor
        run: npx playwright test --config tests/inline-work.playwright.config.mts
      - name: Upload fixture-only screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: IGOR-main-one-column-proof
          path: private-igor/test-results/inline-work-*.png
          if-no-files-found: ignore
          retention-days: 7
