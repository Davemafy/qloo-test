name: Remove transient private-source CI artifact
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/igor-pr38-cleanup.yml
permissions:
  actions: write
  contents: read
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete transient PR38 autoformat artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X DELETE repos/Davemafy/qloo-test/actions/artifacts/13026666955
