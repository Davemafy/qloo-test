name: Offline provider regression tests
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/offline-validation.yml]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: All standalone script contracts
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Response summary regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
