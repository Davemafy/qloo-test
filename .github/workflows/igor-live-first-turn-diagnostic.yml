name: Igor production Qloo first-turn acceptance
on:
  push:
    branches: [main]
    paths: [.github/workflows/igor-live-first-turn-diagnostic.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      IGOR_BASE: https://igor-production-243e.up.railway.app
      EXPECTED_SHA: 33a0521d30829cb9be86f9cfc1f0d8f9c6fb2f20
    steps:
      - name: One bounded anonymous cultural discovery turn on deployed exact revision
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,http.cookiejar,json,time,uuid,os,sys
          base=os.environ['IGOR_BASE']
          expected=os.environ['EXPECTED_SHA']
          jar=http.cookiejar.CookieJar()
          http=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar))
          def call(path,data=None,timeout=150):
              head={'Origin':base,'Accept':'application/json'}
              if data is not None: head['Content-Type']='application/json'
              req=urllib.request.Request(base+path,headers=head,data=json.dumps(data).encode() if data is not None else None,method='POST' if data is not None else 'GET')
              return http.open(req,timeout=timeout)
          try:
              health={}
              for attempt in range(18):
                  with call('/api/health',timeout=12) as resp: health=json.load(resp)
                  if health.get('revision')==expected: break
                  time.sleep(6)
              print('EXACT_PRODUCTION_REVISION',health.get('revision')==expected,flush=True)
              if health.get('revision')!=expected: sys.exit(3)
              with call('/api/tasks',{}) as resp: task=json.load(resp)
              print('WORKSPACE_MODE',task.get('mode'),'CREATED',bool(task.get('id')),flush=True)
              if task.get('mode')!='qloo-live' or not task.get('id'): sys.exit(3)
              turnid=str(uuid.uuid4())
              prompt='I like Radiohead. Use Qloo taste intelligence to discover three related indie artists, explain the connections, and save a shortlist.'
              action={'type':'message','text':prompt,'version':task['brief']['version'],'clientTurnId':turnid,'workspaceId':task['id']}
              terminal=None
              with call('/api/tasks/'+task['id']+'/turn',action,timeout=180) as stream:
                  for line in stream:
                      if not line.startswith(b'data: '): continue
                      try: event=json.loads(line[6:])
                      except (ValueError,UnicodeDecodeError): continue
                      if event.get('type') in ('done','error'):
                          terminal=event.get('type')
                          break
              with call('/api/tasks/'+task['id']) as resp: task=json.load(resp)
              with call('/api/tasks/'+task['id']+'/turn?turnId='+turnid) as resp: journal=json.load(resp)
              replies=[m for m in task.get('messages',[]) if m.get('role')=='assistant']
              actual=[e for e in task.get('evidence',[]) if e.get('kind')=='cultural' and e.get('source')=='provider-returned' and e.get('freshness')=='current' and e.get('delivery')=='LIVE']
              trace=[x.get('action','') for x in (task.get('trace') or [])[-25:]]
              print('CULTURAL_SMOKE_TERMINAL',terminal,'TASK_STATUS',task.get('status'),'JOURNAL',journal.get('status'),'ASSISTANT_REPLY_COUNT',len(replies),'LIVE_QLOO_EVIDENCE_COUNT',len(actual),'CURRENT_CANDIDATES',len([c for c in task.get('candidates',[]) if c.get('freshness')=='current']),'RESEARCH_TRACE',any(x.startswith('tool.invoke:') for x in trace),flush=True)
              success=terminal=='done' and journal.get('status') in ('completed','awaiting_input') and task.get('status') not in ('error',) and len(replies)>0 and len(actual)>0
              print('REAL_QLOO_CONVERSATION_ACCEPTED',success,flush=True)
              if not success:
                  print('FAILED_TRACE_CATEGORIES',[x[:45] for x in trace if 'error' in x or 'blocked' in x or x.startswith('tool.invoke')][-8:],flush=True)
                  sys.exit(1)
          except urllib.error.HTTPError as error:
              print('HTTP_FAILURE',error.code,flush=True)
              sys.exit(1)
          except Exception as error:
              print('TRANSPORT_FAILURE',type(error).__name__,flush=True)
              sys.exit(1)
          PY
