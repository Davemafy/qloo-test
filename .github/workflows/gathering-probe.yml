name: Six-profile cultural comparison
# Resume genuine archived results and explicitly confirm the sample's 2016 Moonlight identity.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/gathering-probe.yml]
permissions:
  contents: read
  actions: read
jobs:
  providers:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline contracts
        run: python -m unittest discover -s scripts -p 'test_*probe.py' -v
      - name: Reuse genuine captured pool without repeating its Qloo requests
        uses: actions/download-artifact@v4
        with:
          name: six-profile-provider-evidence
          run-id: 40093676803
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: prior
      - name: Bounded fresh Qloo pool and independent Gemini arms
        env:
          QLOO_API_KEY: ${{ secrets.QLOO_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/gathering_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: six-profile-provider-evidence
          path: artifacts/gathering-probe.json
          retention-days: 7
