name: Igor admitted-turn integration regression (private source)
on:
  push:
    branches: [main]
    paths: [.github/workflows/igor-pr33-build-smoke.yml]
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Pinned exact Igor SHA"
        required: false
        type: string

permissions:
  contents: read

jobs:
  map-and-turn:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      IGOR_TEST_FIXTURES: "1"
      QLOO_API_KEY: ""
      GEMINI_API_KEY: ""
      XAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      SELECTED_COMMIT: ${{ inputs.commit_sha || 'fb277360e94a25776660f48a4171bda152e5486e' }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Davemafy/igor
          ref: ${{ env.SELECTED_COMMIT }}
          token: ${{ secrets.PRIVATE_CI_READ_TOKEN }}
          persist-credentials: false
          path: igor
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: igor/package-lock.json
      - name: Install
        working-directory: igor
        run: npm ci --no-audit --no-fund
      - name: Test API-style admitted turn, map requests and scope boundaries
        working-directory: igor
        run: |
          npx vitest run --config tests/vitest.config.mts             tests/unit/map-turn-integration.test.ts             tests/unit/map-and-retry-intent.test.ts             tests/unit/place-search-intent.test.ts             tests/unit/map-context.test.ts             tests/unit/tmdb-visual-discovery.test.ts
      - name: Typecheck production code
        working-directory: igor
        run: npm run typecheck
      - name: Record pinned result (no private artifacts)
        if: always()
        run: |
          echo "Igor exact commit: $SELECTED_COMMIT" >> "$GITHUB_STEP_SUMMARY"
          echo "No live Qloo/model calls, deployments or private source exports." >> "$GITHUB_STEP_SUMMARY"
