name: Igor exact-source mobile map browser acceptance
on:
  push:
    branches: [main]
    paths: [.github/workflows/igor-pr33-build-smoke.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      QLOO_API_KEY: ""
      GEMINI_API_KEY: ""
      OPENAI_API_KEY: ""
      XAI_API_KEY: ""
      IGOR_QLOO_RECORDING: ""
      IGOR_SHA: 5fe1d134277e19e75eb269a1388198dc8ea029d7
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Davemafy/igor
          ref: ${{ env.IGOR_SHA }}
          token: ${{ secrets.PRIVATE_CI_READ_TOKEN }}
          persist-credentials: false
          path: igor
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: igor/package-lock.json
      - name: Install
        working-directory: igor
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        working-directory: igor
        run: npm run typecheck
      - name: Build actual application
        working-directory: igor
        run: npm run build
      - name: Install Chromium
        working-directory: igor
        run: npx playwright install --with-deps chromium
      - name: Mobile map, media, and persistence in real Chromium
        working-directory: igor
        run: npx playwright test --config tests/playwright.config.mts --project=provider-boundary --grep "a New York request renders the map surface" --workers=1 --reporter=line
      - name: Source-bound status
        if: always()
        run: echo "Exact private Igor source $IGOR_SHA; no paid APIs or private screenshots exported" >> "$GITHUB_STEP_SUMMARY"
