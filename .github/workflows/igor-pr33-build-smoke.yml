name: Igor current product desktop and mobile journey
on:
  push:
    branches: [main]
    paths: [.github/workflows/igor-pr33-build-smoke.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 27
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      IGOR_TEST_FIXTURES: "1"
      QLOO_API_KEY: ""
      GEMINI_API_KEY: ""
      OPENAI_API_KEY: ""
      XAI_API_KEY: ""
      IGOR_SHA: 6ea0f75e9bd4f9b945f44455720dc16d917d499f
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Davemafy/igor
          ref: ${{ env.IGOR_SHA }}
          token: ${{ secrets.PRIVATE_CI_READ_TOKEN }}
          persist-credentials: false
          path: igor
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: igor/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: igor
      - name: Production build
        run: npm run build
        working-directory: igor
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: igor
      - name: Current product real browser journey
        working-directory: igor
        run: |
          npx playwright test --config tests/frontend-foundation.playwright.config.mts --project=desktop --project=mobile --grep "entry, real saved work edits" --workers=1 --reporter=list
      - name: Record reviewed source
        if: always()
        run: echo "Exact Igor commit ${{ env.IGOR_SHA }}; no live Qloo charges and no private code or screenshots exported." >> "$GITHUB_STEP_SUMMARY"
