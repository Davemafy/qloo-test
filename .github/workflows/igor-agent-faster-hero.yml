name: Igor — accelerate README video hero

on:
  push:
    branches: [main]
    paths: [.github/workflows/igor-agent-faster-hero.yml]

permissions:
  contents: read

jobs:
  encode:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      SOURCE_SHA: 423c6be1901bf23ee879e333138d9b8600647286
      VIDEO: assets/Screen Recording 2026-10-31 035320.mp4
      HERO: assets/readme/igor-demo-preview.gif
      GIT_TERMINAL_PROMPT: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Davemafy/igor-agent
          ref: 423c6be1901bf23ee879e333138d9b8600647286
          persist-credentials: false
          path: product

      - name: Install video tools
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg > /dev/null

      - name: Replace slow hero with a 2.3x speed, 16 fps cut
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git hash-object "$VIDEO")" = 5c26f814cedbdcd81e7e07c67f46241542ffb521
          test -f "$HERO"
          test "$(grep -c 'src="assets/readme/igor-demo-preview.gif"' README.md)" = 1
          ffmpeg -hide_banner -loglevel error -threads 2 -ss 3.5 -t 14.0 \
            -i "$VIDEO" \
            -filter_complex '[0:v]setpts=(PTS-STARTPTS)/2.3,fps=16,scale=720:-2:flags=lanczos,split[a][b];[a]palettegen=stats_mode=diff[p];[b][p]paletteuse=dither=bayer:bayer_scale=5[v]' \
            -map '[v]' -loop 0 -y "$HERO"
          frames="$(ffprobe -v error -count_frames -select_streams v:0 -show_entries stream=nb_read_frames -of default=nokey=1:noprint_wrappers=1 "$HERO")"
          size="$(stat -c '%s' "$HERO")"
          test "$frames" -gt 70 && test "$frames" -lt 130
          test "$size" -lt 12000000
          echo "Encoded a smooth 2.3x hero at 16 fps: $frames frames, $size bytes."
          git config user.name igor-submission-ci
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$HERO"
          git commit -m "media: accelerate Igor README hero to 2.3x at 16fps"

      - name: Push to main only (fast-forward, no force)
        working-directory: product
        shell: bash
        env:
          WRITE_TOKEN: ${{ secrets.IGOR_SUBMISSION_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$WRITE_TOKEN"
          cat > "$RUNNER_TEMP/askpass" <<'SH'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' x-access-token ;;
            *Password*) printf '%s\n' "$WRITE_TOKEN" ;;
            *) exit 1 ;;
          esac
          SH
          chmod 700 "$RUNNER_TEMP/askpass"
          export GIT_ASKPASS="$RUNNER_TEMP/askpass"
          git push https://github.com/Davemafy/igor-agent.git HEAD:refs/heads/main \
            > "$RUNNER_TEMP/push.log" 2>&1
          echo "Video hero updated on main."

      - name: Clean up credentials
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/askpass" "$RUNNER_TEMP/push.log"
