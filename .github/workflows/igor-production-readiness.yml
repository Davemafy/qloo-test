name: Igor production backend public health verification
on:
  push:
    branches: [main]
    paths: [.github/workflows/igor-production-readiness.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify public backend liveness and revision (no credentials)
        shell: bash
        run: |
          set -euo pipefail
          url="https://igor-production-243e.up.railway.app/api/health"
          status="$(curl --location --silent --show-error --max-time 15 --output "$RUNNER_TEMP/igor-response.json" --write-out '%{http_code}' "$url")" || {
            echo "::error::Production backend could not be reached."
            exit 1
          }
          echo "Production health HTTP: $status"
          if [[ "$status" != "200" ]]; then
            echo "::error::Backend health returned non-200."
            exit 1
          fi
          node -e 'const fs=require("node:fs"); const raw=fs.readFileSync(process.argv[1],"utf8");let data;try{data=JSON.parse(raw)}catch{process.exit(1)};console.log("Backend liveness:",data.status==="ok"?"ok":"failed");console.log("Backend revision:",/^[a-f0-9]{7,40}$/i.test(data.revision??"")?data.revision:"unavailable");if(data.status!=="ok")process.exit(1)' "$RUNNER_TEMP/igor-response.json"
          echo "Note: HTTP liveness does not prove provider access, persistence, or successful agent turns."
