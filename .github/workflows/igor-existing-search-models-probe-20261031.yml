name: Igor existing web search model availability
on:
  push:
    branches: [main]
    paths: [.github/workflows/igor-existing-search-models-probe-20261031.yml]
permissions: {}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
      GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
    steps:
      - name: Check available models and minimal grounded tool permissions
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,urllib.error
          def send(label,url,method="GET",key="",body=None,auth=""):
            if not key:
              print(label,"NO_KEY",flush=True)
              return None
            headers={"Content-Type":"application/json"}
            if auth=="google": headers["x-goog-api-key"]=key
            if auth=="bearer": headers["Authorization"]="Bearer "+key
            req=urllib.request.Request(url,headers=headers,method=method,
              data=json.dumps(body).encode() if body is not None else None)
            try:
              with urllib.request.urlopen(req,timeout=28) as res:
                return json.load(res)
            except urllib.error.HTTPError as e:
              print(label,"HTTP",e.code,flush=True)
            except Exception as e:
              print(label,"ERROR_TYPE",type(e).__name__,flush=True)
            return None
          gemini=os.getenv("GEMINI_API_KEY","")
          data=send("GEMINI_MODELS","https://generativelanguage.googleapis.com/v1beta/models?pageSize=100","GET",gemini,auth="google")
          if data:
            names=[x.get("name","").split("/")[-1] for x in data.get("models",[])]
            for model in ("gemini-2.5-flash","gemini-3-flash-preview","gemini-3.8-flash","gemini-3.5-flash-lite"):
              print("GEMINI_MODEL",model,"AVAILABLE" if model in names else "NOT_LISTED",flush=True)
            print("GEMINI_MODEL_COUNT",len(names),flush=True)
          xai=os.getenv("XAI_API_KEY") or os.getenv("GROK_API_KEY") or ""
          data=send("XAI_MODELS","https://api.x.ai/v1/models","GET",xai,auth="bearer")
          if data:
            models=[x.get("id","") for x in data.get("data",[])]
            print("XAI_GROK_4_7_LISTED","grok-4.7" in models,flush=True)
            print("XAI_MODEL_COUNT",len(models),flush=True)
          data=send("XAI_MINIMAL_WEB","https://api.x.ai/v1/responses","POST",xai,
            {"model":"grok-4.7","input":[{"role":"user","content":"Use web search to find the official Qloo developer documentation."}],"tools":[{"type":"web_search"}]},
            auth="bearer")
          if data:
            print("XAI_MINIMAL_WEB_STATUS",data.get("status","none"),"STRUCTURED_CITATIONS",len(data.get("citations") or []),flush=True)
          PY
