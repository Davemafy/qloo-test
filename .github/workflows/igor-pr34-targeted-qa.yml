name: Igor connected-work and presentation exact-source regression
on:
  push:
    branches: [main]
    paths: [.github/workflows/igor-pr34-targeted-qa.yml]
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Pinned Igor commit"
        required: false
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      IGOR_TEST_FIXTURES: "1"
      QLOO_API_KEY: ""
      GEMINI_API_KEY: ""
      OPENAI_API_KEY: ""
      XAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      IGOR_SHA: ${{ inputs.commit_sha || 'f07f0c56102234a62ff05ddda75170495262a6ec' }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Davemafy/igor
          ref: ${{ env.IGOR_SHA }}
          token: ${{ secrets.PRIVATE_CI_READ_TOKEN }}
          persist-credentials: false
          path: private-igor
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: private-igor/package-lock.json
      - name: Locked install
        working-directory: private-igor
        run: npm ci --no-audit --no-fund
      - name: Connected work and presentation behavior
        working-directory: private-igor
        run: |
          npx vitest run --config tests/vitest.config.mts \
            tests/unit/metacognitive-review.test.ts \
            tests/unit/connected-work.test.ts \
            tests/unit/presentation.test.ts
      - name: Typecheck
        working-directory: private-igor
        if: always()
        run: npm run typecheck
      - name: Lint (independent)
        working-directory: private-igor
        if: always()
        run: npm run lint
      - name: Record exact SHA
        if: always()
        run: echo "Exact Igor revision $IGOR_SHA; no live Qloo/model calls or source exported" >> "$GITHUB_STEP_SUMMARY"
