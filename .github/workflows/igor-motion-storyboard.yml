name: Igor OutcomeOS Photographic Storyboard

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/igor-motion-storyboard.yml'
      - 'production/assets/create_storyboard.py'

permissions:
  contents: read

jobs:
  render-storyboard:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install graphic production libraries
        run: python -m pip install requests beautifulsoup4 pillow
      - name: Acquire source photographs
        run: python production/assets/download_photos.py
      - name: Create 16 full-HD cinematic storyframes and clean Veo plates
        run: python production/assets/create_storyboard.py
      - name: Validate complete photographic coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('dist/REPORT.json').read_text())
          s=json.loads(Path('dist/storyboard/SHOT_LIST.json').read_text())
          assert r['downloaded']==34, r
          assert s['source_count']==34 and s['shot_count']==16, s
          assert len(list(Path('dist/storyboard/frames').glob('*.jpg')))==16
          assert len(list(Path('dist/storyboard/photo_plates').glob('*.jpg')))==16
          used=set(sum((p['photos'] for p in s['shots']),[]))
          assert used=={'A%02d'%n for n in range(1,35)},sorted(used)
          print('PASS: 34 actual photos, 16 storyboard frames, 16 clean Veo photo plates')
          PY
      - name: Package editor-ready artifact
        run: |
          cp dist/SOURCES.csv dist/storyboard/SOURCE_RIGHTS_REPORT.csv
          cp dist/REPORT.json dist/storyboard/PHOTO_DOWNLOAD_REPORT.json
          cd dist
          zip -q -r -6 IGOR_OutcomeOS_Storyboards_16_Shots.zip storyboard/
          ls -lh IGOR_OutcomeOS_Storyboards_16_Shots.zip
      - name: Upload editor-ready storyboard files
        uses: actions/upload-artifact@v4
        with:
          name: IGOR-OutcomeOS-Photographic-Storyboard
          path: dist/storyboard/
          retention-days: 30
