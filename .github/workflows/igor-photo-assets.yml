name: Igor OutcomeOS Photo Asset Pack

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/igor-photo-assets.yml'
      - 'production/assets/igor-photo-sources.txt'
      - 'production/assets/download_photos.py'

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 pillow
      - name: Fetch images and package sources
        run: python production/assets/download_photos.py
      - name: Print acquisition report
        if: always()
        run: |
          if test -f dist/REPORT.json; then
            python -c 'import json; d=json.load(open("dist/REPORT.json")); print("Downloaded",d["downloaded"],"of",d["total"]); [print(x["id"], x["status"],x["error"][:100]) for x in d["items"]]'
          fi
      - name: Publish downloadable ZIP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: IGOR-OutcomeOS-Real-Image-Library
          path: |
            dist/IGOR_OutcomeOS_Real_Photos.zip
            dist/REPORT.json
            dist/SOURCES.csv
            dist/CONTACT_SHEET.jpg
          if-no-files-found: warn
          retention-days: 30
