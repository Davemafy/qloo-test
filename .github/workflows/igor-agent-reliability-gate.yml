name: Igor agent reliability gate (exact dev commit)
on:
  push:
    branches: [main]
    paths: [.github/workflows/igor-agent-reliability-gate.yml]
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Exact 40-character Igor commit SHA (defaults to last reviewed dev)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      IGOR_TEST_FIXTURES: "1"
      QLOO_API_KEY: ""
      XAI_API_KEY: ""
      GROK_API_KEY: ""
      GEMINI_API_KEY: ""
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      IGOR_QLOO_RECORDING: ""
      SELECTED_COMMIT: ${{ inputs.commit_sha || 'f07f0c56102234a62ff05ddda75170495262a6ec' }}
    steps:
      - name: Validate pinned commit and private source checkout permission
        env:
          TOKEN_PRESENT: ${{ secrets.PRIVATE_CI_READ_TOKEN != '' }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SELECTED_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          test "$TOKEN_PRESENT" = true
          echo "Testing exact private Igor commit: $SELECTED_COMMIT"
      - uses: actions/checkout@v4
        with:
          repository: Davemafy/igor
          ref: ${{ env.SELECTED_COMMIT }}
          token: ${{ secrets.PRIVATE_CI_READ_TOKEN }}
          persist-credentials: false
          path: private-igor
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: private-igor/package-lock.json
      - name: Verify types, app contracts, and browser journeys
        working-directory: private-igor
        shell: bash
        run: |
          set -uo pipefail
          log="$RUNNER_TEMP/igor-verify.log"
          trap 'rm -f "$log"' EXIT
          failures=0
          installed=0
          built=0
          check() {
            label="$1"; shift
            if "$@" > "$log" 2>&1; then
              echo "PASS $label"
              echo "- $label: PASS" >> "$GITHUB_STEP_SUMMARY"
              return 0
            fi
            echo "::error::FAIL $label"
            echo "- $label: FAIL" >> "$GITHUB_STEP_SUMMARY"
            case "$label" in
              Typecheck|Build) grep -E 'error TS[0-9]+|Failed to compile|Module not found|Error:' "$log" | head -12 | cut -c1-160 || true ;;
              Unit|Map-routing|Evaluation|Browser) grep -E 'Test Files|Tests |FAIL |failed|Error:' "$log" | tail -18 | cut -c1-160 || true ;;
            esac
            failures=$((failures+1))
            return 1
          }
          echo "### Exact Igor dev commit $SELECTED_COMMIT" >> "$GITHUB_STEP_SUMMARY"
          if check Install npm ci --no-audit --no-fund; then installed=1; fi
          if ((installed)); then
            check Typecheck npm run typecheck || :
            check Lint npm run lint || :
            check Map-routing npx vitest run --config tests/vitest.config.mts tests/unit/place-search-intent.test.ts tests/unit/tmdb-visual-discovery.test.ts tests/unit/visual-choices.test.ts || :
            check Unit npm test || :
            check Evaluation npm run test:eval || :
            if check Build npm run build; then built=1; fi
            if ((built)); then
              if check Chromium npx playwright install --with-deps chromium; then
                check Browser npm run test:browser || :
              fi
            else
              echo "- Browser: SKIPPED (build failed)" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          echo "- Live providers and deployed Railway behavior: NOT VERIFIED in this offline gate" >> "$GITHUB_STEP_SUMMARY"
          if ((failures)); then
            echo "::error::$failures checks failed at exact commit; not release ready."
            exit 1
          fi
          echo "Offline validation passed at exact commit. Live provider and production checks remain separate."
      - name: Confirm no private source artifacts exported
        if: always()
        run: echo "No private source, screenshots, recordings, API responses or credentials published." >> "$GITHUB_STEP_SUMMARY"
