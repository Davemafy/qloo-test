name: Igor PR38 isolated lint auto-fix package
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/igor-pr38-autofix.yml
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Davemafy/igor
          ref: b3fa1c26fecbda5e697131a653d59c61160ebb0d
          token: ${{ secrets.PRIVATE_CI_READ_TOKEN }}
          persist-credentials: false
          path: private-igor
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: private-igor/package-lock.json
      - name: Install locked dependencies
        working-directory: private-igor
        run: npm ci --silent > /dev/null 2>&1
      - name: Apply exact project ESLint autofixes in working copy
        working-directory: private-igor
        shell: bash
        run: |
          npx eslint src/components tests/browser tests/unit/reference-create-stage.test.tsx tests/unit/workspace-view-model.test.ts --fix > /dev/null 2>&1 || true
          npx prettier --write src/components/agent-workspace.tsx src/components/igor-spatial-canvas.tsx src/components/reference-conversation-results.tsx src/components/reference-create-stage.tsx src/components/reference-document-stage.tsx src/components/reference-work.tsx src/components/workspace-view-model.ts src/components/grounded-map.tsx tests/browser/reference-integrated.e2e.ts tests/browser/reference-populated.e2e.ts tests/browser/reference-twelve.e2e.ts tests/unit/reference-create-stage.test.tsx tests/unit/workspace-view-model.test.ts > /dev/null 2>&1
          mkdir -p ../autofixed
          git diff --name-only -- '*.ts' '*.tsx' | while read -r file; do
            mkdir -p "../autofixed/$(dirname "$file")"
            cp "$file" "../autofixed/$file"
            echo "FIXED_FILE=$file"
          done
          npx eslint src/components tests/browser tests/unit/reference-create-stage.test.tsx tests/unit/workspace-view-model.test.tsx --quiet || true
      - uses: actions/upload-artifact@v4
        with:
          name: igor-pr38-autofixed-source
          path: autofixed/
          if-no-files-found: error
          retention-days: 1
