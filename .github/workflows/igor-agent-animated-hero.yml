name: Igor Agent — render authentic moving README hero

on:
  push:
    branches: [main]
    paths: [.github/workflows/igor-agent-animated-hero.yml]

permissions:
  contents: read

jobs:
  hero:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      PINNED_MAIN: 11c98f2d0d26b629849cb53811e1d0a297b0ab02
      SOURCE_VIDEO: assets/Screen Recording 2026-10-31 035320.mp4
      PREVIEW: assets/readme/igor-demo-preview.gif
      GIT_TERMINAL_PROMPT: '0'
    steps:
      - name: Checkout Igor Agent at reviewed main revision
        uses: actions/checkout@v4
        with:
          repository: Davemafy/igor-agent
          ref: 11c98f2d0d26b629849cb53811e1d0a297b0ab02
          token: ${{ secrets.IGOR_SUBMISSION_WRITE_TOKEN }}
          persist-credentials: false
          path: product

      - name: Install ffmpeg for deterministic video preview rendering
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          command -v ffmpeg
          command -v ffprobe

      - name: Verify exact source and choose real product footage
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PINNED_MAIN"
          test "$(git hash-object "$SOURCE_VIDEO")" = '5c26f814cedbdcd81e7e07c67f46241542ffb521'
          duration="$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$SOURCE_VIDEO")"
          python3 - "$duration" >> "$GITHUB_ENV" <<'PY'
          import sys
          d=float(sys.argv[1])
          assert d >= 3, 'Unexpectedly short video'
          length=min(9.0,d)
          start=max(0.0,min(d*0.1,d-length))
          print(f'CLIP_START={start:.3f}')
          print(f'CLIP_LENGTH={length:.3f}')
          print(f'VIDEO_SECONDS={d:.1f}')
          PY
          echo "Source: genuine existing Igor screen recording, $duration seconds."

      - name: Render moving preview, not invented frames or a fake player
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$PREVIEW")"
          ffmpeg -hide_banner -loglevel error -threads 2 -ss "$CLIP_START" -t "$CLIP_LENGTH" \
            -i "$SOURCE_VIDEO" \
            -filter_complex '[0:v]fps=9,scale=680:-2:flags=lanczos,split[a][b];[a]palettegen=stats_mode=diff[p];[b][p]paletteuse=dither=bayer:bayer_scale=5[v]' \
            -map '[v]' -loop 0 -y "$PREVIEW"
          frames="$(ffprobe -v error -count_frames -select_streams v:0 -show_entries stream=nb_read_frames -of default=nokey=1:noprint_wrappers=1 "$PREVIEW")"
          bytes="$(stat -c '%s' "$PREVIEW")"
          test "$frames" -ge 20 || { echo '::error::Preview must actually move'; exit 1; }
          test "$bytes" -ge 100000 && test "$bytes" -le 18000000 || { echo '::error::Unexpected preview size'; exit 1; }
          echo "Created true looping preview: $frames frames, $bytes bytes; full MP4 retained."

      - name: Display the moving preview as the GitHub README hero
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('README.md')
          s=p.read_text()
          needle='<img src="assets/readme/igor-cover.webp" alt="Igor — your agent with taste, powered by Qloo. Watch the product walkthrough." width="100%">'
          replacement='<img src="assets/readme/igor-demo-preview.gif" alt="Moving preview from the real Igor product screen recording. Select to view the complete video with sound." width="100%">'
          assert s.count(needle)==1, 'README hero changed: refusing to overwrite'
          s=s.replace(needle,replacement)
          marker='</p>\n\n**Most AI gives you recommendations.'
          extra='</p>\n\n<p align="center"><sub>Real product footage · looping silent preview · <a href="assets/Screen%20Recording%202026-10-31%20035320.mp4">Play the complete video with audio</a></sub></p>\n\n**Most AI gives you recommendations.'
          assert s.count(marker)==1
          s=s.replace(marker,extra)
          p.write_text(s)
          PY
          git add README.md "$PREVIEW"
          git config user.name 'igor-submission-ci'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: replace static README cover with actual looping Igor video preview'
          echo 'Animated README preview committed, main-only; no app code modified.'

      - name: Push only to main with no force
        working-directory: product
        shell: bash
        env:
          WRITE_TOKEN: ${{ secrets.IGOR_SUBMISSION_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$WRITE_TOKEN"
          cat > "$RUNNER_TEMP/askpass" <<'SH'
          #!/bin/sh
          case "$1" in
            *Username*) echo x-access-token ;;
            *Password*) printf '%s\n' "$WRITE_TOKEN" ;;
            *) exit 1 ;;
          esac
          SH
          chmod 700 "$RUNNER_TEMP/askpass"
          export GIT_ASKPASS="$RUNNER_TEMP/askpass"
          git push 'https://github.com/Davemafy/igor-agent.git' HEAD:refs/heads/main \
            > "$RUNNER_TEMP/push.log" 2>&1
          echo 'Updated only Igor Agent main; source history and original MP4 unchanged.'

      - name: Remove temporary Git credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/askpass" "$RUNNER_TEMP/push.log"
