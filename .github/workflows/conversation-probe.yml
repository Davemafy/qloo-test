name: Conversational correction contracts
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/conversation-probe.yml]
permissions:
  contents: read
  actions: read
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline provider contracts
        run: python -m unittest discover -s scripts -p 'test_*probe.py' -v
      - uses: actions/download-artifact@v4
        with:
          name: six-profile-provider-evidence
          run-id: 40093853756
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: prior
      - name: Four bounded Gemini extraction requests; no Qloo calls
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/conversation_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conversation-contract-evidence
          path: artifacts/conversation-probe.json
          retention-days: 7
