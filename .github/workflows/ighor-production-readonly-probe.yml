name: Ighor public deployment read-only probe
on:
  push:
    branches: [main]
    paths: [".github/workflows/ighor-production-readonly-probe.yml"]
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect public Railway pages without credentials
        shell: bash
        run: |
          set -eu
          for endpoint in / /app; do
            url="https://igor-production-243e.up.railway.app${endpoint}"
            echo "ENDPOINT: ${endpoint}"
            code=$(curl -sSL --connect-timeout 8 --max-time 20 -o /tmp/ighor-public.html -w '%{http_code}' "$url") || code=unreachable
            echo "HTTP_CODE: ${code}"
            if test -s /tmp/ighor-public.html; then
              python3 -c 'import re,html,pathlib; s=pathlib.Path("/tmp/ighor-public.html").read_text(errors="replace"); m=re.search(r"<title[^>]*>(.*?)</title>",s,re.I|re.S); print("TITLE:",html.unescape(m.group(1))[:180] if m else "none"); print("HAS_IGHOR:",bool(re.search(r"ighor",s,re.I))); print("HAS_IGOR:",bool(re.search(r"igor",s,re.I))); print("HAS_HOME:", "Your agent" in s); print("HTML_BYTES:",len(s))'
            fi
            rm -f /tmp/ighor-public.html
          done
