name: Igor Photo-Driven Storyboard Frames

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/igor-storyboard-render.yml'
      - 'production/assets/generate_igor_storyboard.py'

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 pillow
      - name: Acquire and verify 34 source photographs
        run: python production/assets/download_photos.py
      - name: Generate original photographic storyboard frames
        run: python production/assets/generate_igor_storyboard.py
      - name: Verify storyboard
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('production/storyboards')
          assert len(list((p/'frames').glob('*.jpg'))) == 17
          assert len(list((p/'plates').glob('*.jpg'))) == 17
          assert len(list(p.glob('overview_*.jpg'))) == 5
          print('Verified 17 photographic storyboard frames, 17 clean plates, 5 overview pages.')
          PY
      - name: Commit image files so each frame has a direct URL
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add production/storyboards
          if ! git diff --cached --quiet; then
            git commit -m "assets: publish individual Igor photographic storyboard frames"
            git push origin HEAD:main
          else
            echo "Frames unchanged"
          fi
      - name: Preserve production archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Igor-Photographic-Storyboards-Direct-JPGs
          path: production/storyboards
          if-no-files-found: warn
          retention-days: 30
