name: Igor minimal model endpoint availability (no Qloo and no app deploy)
on:
  push:
    branches: [main]
    paths: [.github/workflows/igor-model-endpoint-preflight.yml]
permissions:
  contents: read
jobs:
  models:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Test four official Gemini models with minimal token budget
        run: |
          node --input-type=module <<'NODE'
          if (!process.env.GEMINI_API_KEY) {
            console.log("BLOCKED: no Gemini key configured");
            process.exit(1);
          }
          const names = [
            "gemini-3.5-flash-lite",
            "gemini-3.1-flash-lite",
            "gemini-3.8-flash",
            "gemini-3.5-flash",
          ];
          for (const name of names) {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), 12000);
            try {
              const res = await fetch(
                `https://generativelanguage.googleapis.com/v1beta/models/${name}:generateContent`,
                {
                  method: "POST",
                  headers: {
                    "content-type": "application/json",
                    "x-goog-api-key": process.env.GEMINI_API_KEY,
                  },
                  body: JSON.stringify({
                    contents: [{ parts: [{ text: "Say OK." }] }],
                    generationConfig: { maxOutputTokens: 24 },
                  }),
                  signal: controller.signal,
                },
              );
              // Only status. Never log credential, raw upstream text or outputs.
              console.log(`${name}: HTTP ${res.status}`);
            } catch (error) {
              console.log(`${name}: network or timeout failure`);
            } finally {
              clearTimeout(timer);
            }
          }
          NODE
