name: Igor legacy branches — audit or safe archive and prune

on:
  push:
    branches: [main]
    paths: [.github/workflows/igor-branch-cleanup.yml]
  workflow_dispatch:
    inputs:
      mode:
        description: audit reports the plan; prune archives then deletes legacy branches
        type: choice
        options: [audit, prune]
        required: true
        default: audit
      confirmation:
        description: For prune only, type ARCHIVE-AND-DELETE-28
        type: string
        required: false

permissions:
  contents: read

jobs:
  legacy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'audit' }}
      CONFIRMATION: ${{ inputs.confirmation }}
      IGOR_READ_TOKEN: ${{ secrets.PRIVATE_CI_READ_TOKEN }}
      IGOR_WRITE_TOKEN: ${{ secrets.IGOR_MAINTENANCE_TOKEN }}
    steps:
      - name: Audit, or archive and prune verified legacy branch refs
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import sys
          import urllib.parse
          import urllib.error
          import urllib.request

          repo = "Davemafy/igor"
          expected_remaining = {"main", "feat/partiful-codrops-unified-20261029"}
          mode = os.environ.get("MODE", "audit")
          confirmation = os.environ.get("CONFIRMATION", "")
          if mode not in {"audit", "prune"}:
              sys.exit("Invalid mode. No branches changed.")
          if mode == "prune" and confirmation != "ARCHIVE-AND-DELETE-28":
              sys.exit("Explicit confirmation required: ARCHIVE-AND-DELETE-28. No branches changed.")
          read_token = os.environ.get("IGOR_READ_TOKEN", "")
          write_token = os.environ.get("IGOR_WRITE_TOKEN", "")
          if not read_token:
              sys.exit("PRIVATE_CI_READ_TOKEN missing. No branches changed.")
          if mode == "prune" and not write_token:
              sys.exit("IGOR_MAINTENANCE_TOKEN missing (fine-grained contents:write on Igor). No branches changed.")

          base = f"https://api.github.com/repos/{repo}"
          def api(method, path, body=None):
              token = write_token if mode == "prune" else read_token
              data = json.dumps(body).encode("utf-8") if body is not None else None
              request = urllib.request.Request(
                  base + path,
                  method=method, data=data,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "Content-Type": "application/json",
                      "User-Agent": "igor-branch-maintenance",
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      raw = response.read()
                      return json.loads(raw.decode()) if raw else None
              except urllib.error.HTTPError as ex:
                  code = ex.code
                  ex.close()
                  raise RuntimeError(f"{method} {path} HTTP {code}") from None

          def git_ref(kind, name):
              return f"/git/ref/{kind}/" + urllib.parse.quote(name, safe="/")

          branches = []
          page = 1
          while True:
              batch = api("GET", f"/branches?per_page=100&page={page}")
              branches.extend(batch)
              if len(batch) < 100:
                  break
              page += 1
          names = {b["name"] for b in branches}
          if not expected_remaining.issubset(names):
              sys.exit("main or the sole development branch is missing. No branches changed.")
          old = {b["name"]: b["commit"]["sha"] for b in branches if b["name"] not in expected_remaining}
          if any(b["protected"] for b in branches if b["name"] in old):
              sys.exit("A legacy branch is protected. No branches changed.")
          # This precise audited set was checked against the sole open PR #27
          # before installing the workflow. The CI token does not have
          # pull-requests:read on Igor. NEVER broaden the deletion set when
          # a ref is new, moved, or missing; re-audit it with the maintainer.
          expected_legacy = {
              "architecture/outcome-os-evidence-backed": "40889df307d7031c664b4e3fbfde22b54a619c73",
              "codex/connected-work-backend": "6fad0bebaf999e0903e92365faecf213f5ee2145",
              "discovery-experience": "3fdd2de33f669294bd0835809fdd4eb4b765749b",
              "docs/gods-eye-caliber-showcase": "a485648a9392a99a27fa69e19037b8944c62a60e",
              "engine/conversation-routing-reliability-20261027": "7459bd6b007164e8e5d669dbb343ef7c88b1c73c",
              "engine/conversational-profiles": "31e36bfa423c48cc3c41c674257099c8a2f75f97",
              "engine/evidence-contracts": "3f82f846fd6793c12987711d23463ea603baee5a",
              "eval/50k-conversations-20261027": "15cd22162888b898f991f84c64d9f7729a5285e6",
              "feat/connected-artifact-approvals": "96ae2e39da3e41940fcca0cd39353563ca833c77",
              "feat/declarative-task-canvas": "28c1b3124619cb47cf584fd55067809f43b4b7c7",
              "feat/grounded-living-discovery": "d1c9d9d98e47ed34ba989a0311d5bacfc2a8f063",
              "feat/original-codrops-gallery-20261029": "762b70d69b343f60eb37b13ad8f2055fe79e1762",
              "feat/partiful-native-invite": "e5fabbb47b6a1647bc1a6e9cb0151135be16e88b",
              "feat/prove-consumer-taste-value": "c9de10dfcd92bf17d4d5dd01e49a1c7eab36aa6e",
              "feat/qloo-cultural-workspace": "ced0b1558d86f0194e95ad115432231268fa7537",
              "feat/taste-lens-visual-showcase": "71a50bbb21d84f6361529bff530241de337b86a3",
              "feat/true-morphing-spatial-workspace": "30860dc0ef7b7915171ab3634ea71aac19f8f619",
              "feat/validated-liquid-workflow-20261027": "39e4136b951b717cddac28291788b993ffd0da74",
              "fix/memory-cap-regression": "0d5a6b13f45b60f47781e4731196400f6dc3603a",
              "fix/mobile-morphing-quality-gate": "d5aa8b4128c2dd7e6ac5adc15e4fd3dbe2addd80",
              "fix/model-first-turn-reliability-20261027": "50d2307b7d37596b12ec387d14905e427a4bd36a",
              "integration/general-agent-runtime-20261028": "c6af78d5b1136a8f3106b5d4d1cf6fdffcc3b7bc",
              "integration/morphing-ui-connected-work": "ba7988048c2e594f2a684f8b0c8a5c01a8db1b14",
              "integration/one-chat-verified-20261028": "8d899c57f6c3176254acfdd32a298b500d54d6a6",
              "integration/vision-product-hardening-20261029": "88f72d65269d2118be7990d548e0819600ab56a8",
              "reference/rainbow-reconstruction": "0e4bbb147fc06edf9da4b6b8be7f497f433cfbbf",
              "research/codrops-structure-harvest-20261029": "9ec658077eaf2203dd9afc6045119028af502872",
              "visual-taste-journey": "132b4cb92e6855a5af235dde75ddd54fe98087a7",
          }
          if old != expected_legacy:
              sys.exit("Legacy branch names or SHA moved since review. No branches changed.")
          print(f"MODE={mode} OLD_BRANCHES={len(old)} KEEP=main+single-dev")
          if mode == "audit":
              print(f"Audit completed. No branches modified. Ready for review: {len(old)} legacy HEADs.")
              sys.exit(0)

          # User authorized exactly the observed cleanup target, no mass-delete
          # if the branch count changes unexpectedly between audit and prune.
          if len(old) != 28:
              sys.exit(f"Expected exactly 28 legacy branches; found {len(old)}. No branches changed.")

          # Phase 1: create and independently verify every archival tag.
          for name, sha in sorted(old.items()):
              if not re.fullmatch(r"[0-9a-f]{40}", sha):
                  sys.exit("Unexpected SHA: no branch deletion.")
              tag = "archive/igor-20261029/" + name
              path = git_ref("tags", tag)
              try:
                  previous = api("GET", path)
              except RuntimeError as exc:
                  if "HTTP 404" not in str(exc):
                      raise
                  previous = None
              if previous is None:
                  api("POST", "/git/refs", {"ref": "refs/tags/" + tag, "sha": sha})
              actual = api("GET", path)
              if actual["object"]["sha"] != sha:
                  sys.exit("Archival tag mismatch: no branch deletion.")
          print("ARCHIVE_VERIFIED=28")

          # Phase 2: revalidate every ref before deleting any of them.
          for name, sha in old.items():
              current = api("GET", git_ref("heads", name))
              if current["object"]["sha"] != sha:
                  sys.exit("Legacy branch changed since audit. All originals retained.")
          print("BRANCH_HEADS_VERIFIED=28")

          # Phase 3: prune only previously archived refs.
          for name, sha in sorted(old.items()):
              latest = api("GET", git_ref("heads", name))
              if latest["object"]["sha"] != sha:
                  sys.exit("Branch moved during cleanup. Stopped to protect remaining refs.")
              api("DELETE", "/git/refs/heads/" + urllib.parse.quote(name, safe="/"))
          fresh = api("GET", "/branches?per_page=100")
          remaining = {b["name"] for b in fresh}
          if remaining != expected_remaining:
              sys.exit(f"Cleanup incomplete: {len(remaining)} branches remain.")
          print("SUCCESS_ARCHIVED_AND_DELETED=28 REMAINING_BRANCHES=2")
          PY
