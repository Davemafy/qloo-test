name: Igor chill-night conversation grounding
on:
  push:
    branches: [main]
    paths: [.github/workflows/igor-chill-night-grounding-20261101.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      QLOO_API_KEY: ""
      BRIGHTDATA_API_KEY: ""
      TAVILY_API_KEY: ""
      GEMINI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Davemafy/igor
          ref: 7576e9c88bab1b322b16a35bd474be875e2d1838
          token: ${{ secrets.PRIVATE_CI_READ_TOKEN }}
          persist-credentials: false
          path: igor
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: igor/package-lock.json
      - run: npm ci
        working-directory: igor
      - name: Strict repository formatting
        run: npm run format:check
        working-directory: igor
      - name: Strict TypeScript
        run: npm run typecheck
        working-directory: igor
      - name: Strict scoped lint
        run: npx eslint src/core/grounded-social-context.ts src/core/grounded-followup.ts src/core/agent-tool-registry.ts tests/unit/grounded-followup.test.ts
        working-directory: igor
      - run: npm test
        working-directory: igor
      - run: npm run build
        working-directory: igor
