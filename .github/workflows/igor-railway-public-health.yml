name: Igor Railway exact-revision and map conversation smoke
on:
  push:
    branches: [main]
    paths: [.github/workflows/igor-railway-public-health.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      EXPECTED_SHA: 5b580690dce90b5c91264817478eb2a3f8eab515
      IGOR_BASE: https://igor-production-243e.up.railway.app
    steps:
      - name: Verify actual deployed revision and anonymous map request
        shell: bash
        run: |
          python3 - <<'PY'
          import os,json,uuid,time,urllib.request,urllib.error,http.cookiejar,sys
          base=os.environ["IGOR_BASE"]
          expected=os.environ["EXPECTED_SHA"]
          jar=http.cookiejar.CookieJar()
          client=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar))
          def request(path,body=None,timeout=35):
              headers={"Origin":base,"Accept":"application/json"}
              if body is not None: headers["Content-Type"]="application/json"
              obj=urllib.request.Request(base+path, data=json.dumps(body).encode() if body is not None else None,headers=headers,method="POST" if body is not None else "GET")
              return client.open(obj,timeout=timeout)
          def check(name,yes):
              print("PRODUCTION_CHECK",name,"PASS" if yes else "FAIL",flush=True)
              if not yes: raise AssertionError(name)
          try:
              health={}
              for attempt in range(12):
                  with request("/api/health",timeout=16) as response: health=json.load(response)
                  if health.get("revision")==expected: break
                  time.sleep(5)
              check("exact_railway_revision",health.get("revision")==expected and health.get("status")=="ok")
              with request("/app") as response: check("app_route",response.status==200)
              with request("/api/tasks",{}) as response: task=json.load(response)
              check("session_and_task",bool(task.get("id")) and isinstance(task.get("brief",{}).get("version"),int))
              turnid=str(uuid.uuid4())
              payload={"type":"message","text":"Show me New York","version":task["brief"]["version"],"clientTurnId":turnid,"workspaceId":task["id"]}
              terminal=None
              with request("/api/tasks/"+task["id"]+"/turn",payload,timeout=80) as stream:
                  check("turn_http",stream.status==200)
                  for line in stream:
                      if not line.startswith(b"data: "): continue
                      try: event=json.loads(line[6:])
                      except (ValueError,UnicodeDecodeError): continue
                      if event.get("type") in ("done","error"):
                          terminal=event.get("type"); break
              check("turn_terminal",terminal=="done")
              with request("/api/tasks/"+task["id"]) as response: task=json.load(response)
              print("SYNTHETIC_MAP_REQUEST",str(task.get("mapRequest"))[:180],flush=True)
              print("SYNTHETIC_STATUS",task.get("status"),"TRACE",[(entry.get("action") or "")[:70] for entry in (task.get("trace") or [])[-8:]],flush=True)
              print("SYNTHETIC_ASSISTANT_LAST",[(entry.get("text") or "")[:180] for entry in (task.get("messages") or []) if entry.get("role")=="assistant"][-1:],flush=True)
              check("map_request_persisted",task.get("mapRequest",{}).get("destination","").lower()=="new york")
              replies=[x.get("text","") for x in task.get("messages",[]) if x.get("role")=="assistant"]
              check("honest_map_reply",bool(replies) and "getting the map ready" not in replies[-1].lower())
              with request("/api/tasks/"+task["id"]+"/visual-choices?discover=1") as response: images=json.load(response)
              check("unrelated_media_suppressed",images.get("items")==[])
              with request("/api/maps/config") as response: config=json.load(response)
              check("browser_maps_configured",bool(config.get("browserKey")))
              print("RESULT LIVE_MAP_CONVERSATION_API_PASS; visual Google Maps rendering requires an independent browser check",flush=True)
          except Exception as error:
              print("RESULT FAIL",type(error).__name__,flush=True)
              sys.exit(1)
          PY
