name: Igor PR verification (private source)

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/private-source-ci.yml
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Exact 40-character commit SHA of the reviewed Igor revision"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: igor-private-ci-${{ github.event_name }}-${{ inputs.commit_sha || github.sha }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      # The pinned push revision is PR #13 at workflow creation, not main or latest.
      SELECTED_COMMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.commit_sha || '2359f3fe6b42299f63db089d269d5bd47a34decf' }}
      QLOO_API_KEY: ""
      GEMINI_API_KEY: ""
      OPENAI_API_KEY: ""
    steps:
      - name: Validate exact private revision and authorization
        shell: bash
        env:
          READ_TOKEN_CONFIGURED: ${{ secrets.PRIVATE_CI_READ_TOKEN != '' }}
        run: |
          set -euo pipefail
          if [ "$READ_TOKEN_CONFIGURED" != "true" ]; then
            echo "::error::Add qloo-test Actions secret PRIVATE_CI_READ_TOKEN with read-only access to Davemafy/igor."
            exit 1
          fi
          if ! [[ "$SELECTED_COMMIT" =~ ^[a-fA-F0-9]{40}$ ]]; then
            echo "::error::Use an exact 40-character commit SHA."
            exit 1
          fi
          echo "Private source revision pinned; no source will be logged or uploaded."

      - name: Check out the exact private Igor commit, ephemerally
        uses: actions/checkout@v4
        with:
          repository: Davemafy/igor
          ref: ${{ env.SELECTED_COMMIT }}
          token: ${{ secrets.PRIVATE_CI_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: private-igor

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: private-igor/package-lock.json

      - name: Install dependencies and run isolated quality checks
        working-directory: private-igor
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/private-ci-output.txt"
          trap 'rm -f "$log"' EXIT
          quiet() {
            local label="$1"; shift
            if "$@" >"$log" 2>&1; then
              echo "$label: PASSED"
              : >"$log"
            else
              echo "::error::$label: FAILED; private compiler/test output has not been published."
              exit 1
            fi
          }
          quiet "Install" npm ci
          quiet "Typecheck" npm run typecheck
          quiet "Lint" npm run lint
          quiet "Unit tests" npm test
          quiet "Blind agent evaluation" npm run test:eval
          quiet "Production build" npm run build

      - name: Install Chromium without exposing private logs
        working-directory: private-igor
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/private-browser-install.txt"
          trap 'rm -f "$log"' EXIT
          if npx playwright install --with-deps chromium >"$log" 2>&1; then
            echo "Browser installation: PASSED"
          else
            echo "::error::Browser installation: FAILED"
            exit 1
          fi

      - name: Run authenticated browser regression suite
        working-directory: private-igor
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/private-browser-tests.txt"
          trap 'rm -f "$log"' EXIT
          if npm run test:browser >"$log" 2>&1; then
            echo "Browser suite: PASSED"
          else
            echo "::error::Browser suite: FAILED (private traces withheld)"
            exit 1
          fi
