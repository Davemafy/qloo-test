name: Igor PR verification (private source)

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/private-source-ci.yml
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Exact 40-character commit SHA of the reviewed Igor revision"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: igor-private-ci-${{ github.event_name }}-${{ inputs.commit_sha || github.sha }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      # The pinned push revision is Igor PR #21, reviewed head SHA; never a mutable branch.
      SELECTED_COMMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.commit_sha || '4cc5fa3a126cbb6d4bee7c3dbf91631119ad9e70' }}
      QLOO_API_KEY: ""
      GEMINI_API_KEY: ""
      OPENAI_API_KEY: ""
    steps:
      - name: Validate exact private revision and authorization
        shell: bash
        env:
          READ_TOKEN_CONFIGURED: ${{ secrets.PRIVATE_CI_READ_TOKEN != '' }}
          QLOO_CONFIGURED: ${{ secrets.QLOO_API_KEY != '' }}
          GROK_CONFIGURED: ${{ secrets.XAI_API_KEY != '' || secrets.GROK_API_KEY != '' }}
          CLAUDE_CONFIGURED: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          GEMINI_CONFIGURED: ${{ secrets.GEMINI_API_KEY != '' }}
        run: |
          set -euo pipefail
          if [ "$READ_TOKEN_CONFIGURED" != "true" ]; then
            echo "::error::Add qloo-test Actions secret PRIVATE_CI_READ_TOKEN with read-only access to Davemafy/igor."
            exit 1
          fi
          if ! [[ "$SELECTED_COMMIT" =~ ^[a-fA-F0-9]{40}$ ]]; then
            echo "::error::Use an exact 40-character commit SHA."
            exit 1
          fi
          echo "Private source revision pinned; no source will be logged or uploaded."
          echo "Provider binding presence: Qloo=$QLOO_CONFIGURED Grok=$GROK_CONFIGURED Claude=$CLAUDE_CONFIGURED Gemini=$GEMINI_CONFIGURED"

      - name: Check out the exact private Igor commit, ephemerally
        uses: actions/checkout@v4
        with:
          repository: Davemafy/igor
          ref: ${{ env.SELECTED_COMMIT }}
          token: ${{ secrets.PRIVATE_CI_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: private-igor

      - name: Verify byte-identical recorded Qloo archive (private)
        working-directory: private-igor
        shell: bash
        run: |
          set -euo pipefail
          file="tests/fixtures/qloo-cultural.json.gz"
          if [ ! -s "$file" ]; then
            echo "::error::Original cultural archive is missing from the pinned checkout."
            exit 1
          fi
          gz_hash="$(sha256sum "$file" | cut -d' ' -f1)"
          data_hash="$(gzip -cd "$file" | sha256sum | cut -d' ' -f1)"
          if [ "$gz_hash" != "3aedaf3dc10952f9a3a0ffe8b46d329bcb1ce453bbc6aa11cdd636ae6148904e" ] || [ "$data_hash" != "7fc699b2f275676795a7aff42bd35455126cfeb904382ee6c89d1997e6e97bd0" ]; then
            echo "::error::The original cultural archive failed its pinned integrity hashes."
            exit 1
          fi
          echo "Original archived Qloo recording verified against both checksums; no bytes published."

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: private-igor/package-lock.json

      - name: Run each check independently, with private logs withheld
        working-directory: private-igor
        shell: bash
        run: |
          set -uo pipefail
          log="$RUNNER_TEMP/private-ci-output.txt"
          trap 'rm -f "$log"' EXIT
          failures=0
          installed=0
          built=0
          browser_ready=0
          echo "### Isolated Igor PR checks" >> "$GITHUB_STEP_SUMMARY"
          quiet() {
            local label="$1"; shift
            if "$@" >"$log" 2>&1; then
              echo "$label: PASSED"
              echo "- $label: PASSED" >> "$GITHUB_STEP_SUMMARY"
              : > "$log"
              return 0
            else
              echo "::error::$label: FAILED (private diagnostic output withheld)"
              echo "- $label: FAILED" >> "$GITHUB_STEP_SUMMARY"
              : > "$log"
              failures=$((failures + 1))
              return 1
            fi
          }
          if quiet "Install" npm ci; then installed=1; fi
          if [ "$installed" -eq 1 ]; then
            quiet "Formatting" npm run format:check || :
            quiet "Typecheck" npm run typecheck || :
            quiet "Lint" npm run lint || :
            quiet "Unit tests" npm test || :
            quiet "Blind agent evaluation" npm run test:eval || :
            if quiet "Production build" npm run build; then built=1; fi
            if [ "$built" -eq 1 ]; then
              if quiet "Chromium installation" npx playwright install --with-deps chromium; then browser_ready=1; fi
              if [ "$browser_ready" -eq 1 ]; then
                if ! quiet "Browser regression suite" npm run test:browser; then
                  # Print only test titles and counts from the private JSON
                  # reporter. Do not publish screenshots, traces, source or
                  # provider bodies in this public repository.
                  python - <<'PY'
          import json,pathlib
          path=pathlib.Path("test-results/results.json")
          if not path.exists():
              print("BROWSER_DIAGNOSTIC: no reporter JSON (check web-server startup)")
          else:
              try:
                  data=json.loads(path.read_text())
                  failed=[]
                  def collect(nodes):
                      for node in nodes:
                          for item in node.get("specs",[]):
                              for test in item.get("tests",[]):
                                  if test.get("status") in ("unexpected", "failed") or any(result.get("status") in ("failed","timedOut","interrupted") for result in test.get("results",[])):
                                      failed.append((item.get("title","unknown"),test.get("projectName","unknown")))
                                      for result in test.get("results",[]):
                                          for error in result.get("errors",[]):
                                              loc=error.get("location",{})
                                              name=str(loc.get("file","")).split("/")[-1]
                                              if name.endswith((".ts",".tsx",".mjs")):
                                                  print("ASSERTION_LOCATION:",name,loc.get("line"),loc.get("column"))
                          collect(node.get("suites",[]))
                  collect(data.get("suites",[]))
                  print("BROWSER_FAILED_COUNT:",len(failed))
                  for title,project in failed[:30]:
                      print("BROWSER_TEST_FAIL:",str(project)[:60],"::",str(title)[:110])
                  if not failed:
                      print("BROWSER_DIAGNOSTIC: browser process failed without a recorded test assertion")
              except (ValueError, OSError):
                  print("BROWSER_DIAGNOSTIC: result JSON unreadable")
          PY
                fi
              fi
            else
              echo "Browser regression suite: SKIPPED (build did not pass)"
              echo "- Browser regression suite: SKIPPED" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          if [ -f test-results/results.json ]; then
            node -e 'console.log("BROWSER_STATS",JSON.stringify(require("./test-results/results.json").stats))'
          fi
          if [ "$failures" -gt 0 ]; then
            echo "::error::$failures quality gate(s) failed. No private logs or source artifacts were published."
            exit 1
          fi
          echo "All isolated quality gates passed."

      - name: Live synthetic flagship with authorized Qloo and Gemini
        if: always()
        timeout-minutes: 15
        working-directory: private-igor
        env:
          QLOO_API_KEY: ${{ secrets.QLOO_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          IGOR_MODEL_PROVIDER: gemini
          IGOR_AGENT_MAX_STEPS: "12"
          IGOR_AGENT_MAX_REQUESTS: "12"
          QLOO_MAX_CALLS: "30"
          IGOR_DB_PATH: .igor/live-verification/tasks.sqlite
          IGOR_AUTH_PATH: .igor/live-verification/auth.sqlite
          IGOR_OUTCOMES_PATH: .igor/live-verification/outcomes.sqlite
          IGOR_CACHE_PATH: .igor/live-verification/cache.sqlite
        shell: bash
        run: |
          set -uo pipefail
          if [ -z "$QLOO_API_KEY" ] || [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::LIVE flagship BLOCKED: authorized Qloo/Gemini binding unavailable."
            exit 1
          fi
          if [ ! -f .next/BUILD_ID ]; then
            echo "::error::LIVE flagship BLOCKED: production build unavailable."
            exit 1
          fi
          log="$RUNNER_TEMP/private-live-server.txt"
          npm start -- --port 3570 >"$log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; rm -f "$log"' EXIT
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3570/app >/dev/null; then break; fi
            sleep 1
          done
          node scripts/verify-live-flagship.mjs
      - name: Synthetic flagship visual evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: igor-live-flagship-attempt
          path: private-igor/test-results/live-flagship/
          retention-days: 7
