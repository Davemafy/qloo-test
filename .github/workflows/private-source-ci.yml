name: Igor PR verification (private source)

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/private-source-ci.yml
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Exact 40-character commit SHA of the reviewed Igor revision"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: igor-private-ci-${{ github.event_name }}-${{ inputs.commit_sha || github.sha }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      # The pinned push revision is Igor PR #16, reviewed head SHA; never a mutable branch.
      SELECTED_COMMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.commit_sha || '91c21354dc124760f64dad6a8945a6bc8164d830' }}
      QLOO_API_KEY: ""
      GEMINI_API_KEY: ""
      OPENAI_API_KEY: ""
    steps:
      - name: Validate exact private revision and authorization
        shell: bash
        env:
          READ_TOKEN_CONFIGURED: ${{ secrets.PRIVATE_CI_READ_TOKEN != '' }}
        run: |
          set -euo pipefail
          if [ "$READ_TOKEN_CONFIGURED" != "true" ]; then
            echo "::error::Add qloo-test Actions secret PRIVATE_CI_READ_TOKEN with read-only access to Davemafy/igor."
            exit 1
          fi
          if ! [[ "$SELECTED_COMMIT" =~ ^[a-fA-F0-9]{40}$ ]]; then
            echo "::error::Use an exact 40-character commit SHA."
            exit 1
          fi
          echo "Private source revision pinned; no source will be logged or uploaded."

      - name: Check out the exact private Igor commit, ephemerally
        uses: actions/checkout@v4
        with:
          repository: Davemafy/igor
          ref: ${{ env.SELECTED_COMMIT }}
          token: ${{ secrets.PRIVATE_CI_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: private-igor

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: private-igor/package-lock.json

      - name: Run each check independently, with private logs withheld
        working-directory: private-igor
        shell: bash
        run: |
          set -uo pipefail
          log="$RUNNER_TEMP/private-ci-output.txt"
          trap 'rm -f "$log"' EXIT
          failures=0
          installed=0
          built=0
          browser_ready=0
          echo "### Isolated Igor PR checks" >> "$GITHUB_STEP_SUMMARY"
          quiet() {
            local label="$1"; shift
            if "$@" >"$log" 2>&1; then
              echo "$label: PASSED"
              echo "- $label: PASSED" >> "$GITHUB_STEP_SUMMARY"
              : > "$log"
              return 0
            else
              echo "::error::$label: FAILED (private diagnostic output withheld)"
              echo "- $label: FAILED" >> "$GITHUB_STEP_SUMMARY"
              : > "$log"
              failures=$((failures + 1))
              return 1
            fi
          }
          if quiet "Install" npm ci; then installed=1; fi
          if [ "$installed" -eq 1 ]; then
            quiet "Formatting" npm run format:check || :
            quiet "Typecheck" npm run typecheck || :
            quiet "Lint" npm run lint || :
            quiet "Unit tests" npm test || :
            quiet "Blind agent evaluation" npm run test:eval || :
            if quiet "Production build" npm run build; then built=1; fi
            if [ "$built" -eq 1 ]; then
              if quiet "Chromium installation" npx playwright install --with-deps chromium; then browser_ready=1; fi
              if [ "$browser_ready" -eq 1 ]; then
                if ! quiet "Browser regression suite" npm run test:browser; then
                  # Print only test titles and counts from the private JSON
                  # reporter. Do not publish screenshots, traces, source or
                  # provider bodies in this public repository.
                  python - <<'PY'
          import json,pathlib
          path=pathlib.Path("test-results/results.json")
          if not path.exists():
              print("BROWSER_DIAGNOSTIC: no reporter JSON (check web-server startup)")
          else:
              try:
                  data=json.loads(path.read_text())
                  failed=[]
                  def collect(nodes):
                      for node in nodes:
                          for item in node.get("specs",[]):
                              for test in item.get("tests",[]):
                                  if test.get("status") in ("unexpected", "failed") or any(result.get("status") in ("failed","timedOut","interrupted") for result in test.get("results",[])):
                                      failed.append((item.get("title","unknown"),test.get("projectName","unknown")))
                          collect(node.get("suites",[]))
                  collect(data.get("suites",[]))
                  print("BROWSER_FAILED_COUNT:",len(failed))
                  for title,project in failed[:30]:
                      print("BROWSER_TEST_FAIL:",str(project)[:60],"::",str(title)[:110])
                  if not failed:
                      print("BROWSER_DIAGNOSTIC: browser process failed without a recorded test assertion")
              except (ValueError, OSError):
                  print("BROWSER_DIAGNOSTIC: result JSON unreadable")
          PY
                fi
              fi
            else
              echo "Browser regression suite: SKIPPED (build did not pass)"
              echo "- Browser regression suite: SKIPPED" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          if [ "$failures" -gt 0 ]; then
            echo "::error::$failures quality gate(s) failed. No private logs or source artifacts were published."
            exit 1
          fi
          echo "All isolated quality gates passed."
